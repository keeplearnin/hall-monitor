# HR staff who may decide leave requests (fictional).
# role: local_manager, hr_business_partner or hr_director. The routing rule
#   (hall_monitor/hr/routing.py) names the least senior role that may decide a request; a
#   decision by anyone less senior is refused. A local manager (the employee's branch manager)
#   approves only the plain light-path case; an HR business partner decides every request sent
#   to HR review, denials and partial approvals; extending past the entitlement and a
#   retaliation-risk case need an HR director.
# public_key: their Ed25519 public key (base64); a decision counts only if signed with the
#   matching private key (governance/signing.py).
# demo_key: true marks a key derived from the staff ID so the demo runs. It is public by
#   construction; a real key comes from the firm's identity system.
