[project]
name = "hall-monitor"
version = "0.1.0"
description = "Governance patterns for agentic AI in regulated financial services."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Hari Perugu" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "langfuse>=5.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hall_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
