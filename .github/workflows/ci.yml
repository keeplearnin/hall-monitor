name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Offline: every test fakes the Claude client, so no API key or network calls are needed.
      - name: Tests
        run: uv run pytest -q

      # HM-25: the system never replies to, contacts or sends anything to anyone. Fails on any
      # sending capability: mail or network libraries, HTTP clients outside egress.py, HTTP
      # write calls, shell commands, sending dependencies.
      - name: No sending capability
        run: uv run python -m hall_monitor.no_send check

      # Kill switch: a pull request may add stops but never remove or edit one, so deleting a
      # stop can't restart an agent without the reviewed approval that clears it.
      - name: Stops are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git cat-file -e FETCH_HEAD:registry/stops.yaml 2>/dev/null; then
            git show FETCH_HEAD:registry/stops.yaml > "$RUNNER_TEMP/base-stops.yaml"
            uv run python -m hall_monitor.kill_switch check-append-only \
              "$RUNNER_TEMP/base-stops.yaml" registry/stops.yaml
          fi

      # Published eval results must meet evals/gate.yaml. No model calls.
      - name: Eval gate
        run: uv run python -m hall_monitor.evals.gate
