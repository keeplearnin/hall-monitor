      - tests/test_hr_signoff.py::test_the_military_exception_needs_the_rest_of_eligibility
      - tests/test_hr_signoff.py::test_the_military_exception_doesn_t_extend_leave
      - tests/test_hr_signoff.py::test_a_reason_for_unclear_leave_is_still_refused_with_an_attestation
      - tests/test_hr_signoff.py::test_an_old_role_or_route_in_an_evidence_pack_is_refused_cleanly
      - tests/test_hr_signoff.py::test_the_chain_check_reports_a_changed_or_missing_signed_leave_decision
    evidence: []
    nist: [GOVERN 3.2, MAP 3.5, MEASURE 2.8]
    finos:
      risks: [RI-22, RI-24]
      mitigations: [MI-21, MI-24]
    gaps: >-
      Weeks approved or extended on other requests count only from decisions that carry the employee's
      keyed hash (from review 46 on), every approval in the log counts with no 12-month window
      (errs towards refusing), and two approvals for one employee on different requests at the
      same moment are each checked against the log as it stood, so both can pass. The three fictional staff use public demo keys derived from their IDs, so a demo decision
      proves nothing about who made it (each logged decision says so); a real deployment issues
      keys from the firm's identity system. The sign-off is a command-line step on one machine's
      audit log: no sign-in and no shared store; the panel shows HR cases but can't decide them.
      Requests
      get into the log through hr.run, which prepares the synthetic messages with the live
      model, or the submission form (HM-24); a preparation that stopped because the intake call failed leaves no pack, so it can
      be run again, and the review CLI lists it as stopped. "Approve" and "extend" cover FMLA leave only; leave under company policy or state law
      for someone the rules find ineligible is decided outside this step. After a request for
      more information the request keeps waiting, but the employee's answer isn't added to the
      evidence: the person decides on the same pack. The
      roles and limits are modelled on a branch company and are this code's choices (HM-21), not
      confirmed by HR. The military attestation is a written reason, stored signed; nothing
      checks it against a record of the family member's status. A request in a log written before
      the roles were renamed can't be decided here: the refusal says it needs preparing again,
      but preparing a request the log already holds is refused too, so it is handled outside
      this step. The live leave eval
      (HM-22) prepares requests but signs no decisions, so the sign-off has been exercised only
      in tests with the demo keys. The evidence pack holds personal and health information an auditor with the database
      can read: the redacted message (with the employee's name and condition), the structured
      request (dates, the reason category, the family relationship, whether an adult child can't
      care for themselves, signs of an accommodation need, a birth or placement date), the hours,
      service and leave already used behind each check, and the explanation. It can be erased
      under a data-protection request, and the log still shows its hash was recorded. A run that
      lost the race to prepare a request leaves its unreferenced pack in the store.

  - id: HM-24
    name: Leave submission form outside the read-only panel
    what: >-
      A separate local web form (python -m hall_monitor.hr.submit) adds leave requests to HR's
      queue, so the control panel stays read-only (HM-20). Each submission goes through the same
      pipeline as hr.run: redaction, the check for text aimed at the AI, the leave agents, the
      rules in code and the audit log, which keeps IDs, keyed hashes, codes and costs, never the
      message. The form decides nothing: the request waits for HR to sign a decision (HM-23), and
      the submitter sees only its ID and state, never its route, reasons or role, and only for
      requests that run of the form added. The mode is chosen explicitly at start: demo mode
      writes to the demo log with the demo builder's scripted model, so it takes only the
      synthetic messages and calls no API; live mode takes free text from a synthetic employee,
      calls the Claude API for each submission, and stops at a spend cap (--max-requests, 20 per
      run by default, 1 to 50 allowed). Every page says synthetic data only, and which mode it is in. With no sign-in it
      answers only requests addressed to localhost or 127.0.0.1 and listens only on loopback; a
      submission must carry the form's token (compared as bytes, so a non-ASCII token is a
      403, not a server error), which another site can't read, and come from the
      form's own origin (the browser's Origin header, and Sec-Fetch-Site when sent), so a page
      elsewhere can't post to it through the browser. Only a form post is taken, each field
      once; a body over the room the longest message needs (about 91 KB, URL-encoded) is refused
      while it is read, and a message over 10,000 characters or for an unknown employee is refused
      before anything is logged. Pages carry the panel's policy (no scripts, nothing from other
      origins, every value escaped) with a same-origin referrer policy, so the browser sends the
      form its origin.
    status: built
    code:
      - hall_monitor/hr/submit.py::create_app
      - hall_monitor/hr/submit.py::main
    tests:
      - tests/test_hr_submit.py::test_a_demo_submission_joins_hr_s_queue_in_the_panel
      - tests/test_hr_submit.py::test_demo_mode_takes_only_a_synthetic_message
      - tests/test_hr_submit.py::test_a_live_submission_runs_the_pipeline_and_logs_no_text
      - tests/test_hr_submit.py::test_live_mode_refuses_an_unknown_employee_and_empty_or_overlong_text
      - tests/test_hr_submit.py::test_a_submission_from_another_site_is_refused
      - tests/test_hr_submit.py::test_only_requests_addressed_to_this_machine_are_answered
      - tests/test_hr_submit.py::test_a_large_body_is_refused_before_it_is_read
      - tests/test_hr_submit.py::test_a_chunked_body_over_the_limit_is_refused
      - tests/test_hr_submit.py::test_a_message_within_the_limit_is_never_too_large_to_send
      - tests/test_hr_submit.py::test_only_a_form_post_is_taken
      - tests/test_hr_submit.py::test_a_refused_submission_doesn_t_use_up_the_spend_cap
      - tests/test_hr_submit.py::test_live_mode_stops_at_its_spend_cap
      - tests/test_hr_submit.py::test_the_result_page_shows_only_requests_submitted_here
      - tests/test_hr_submit.py::test_the_result_page_shows_no_reasons_or_route
      - tests/test_hr_submit.py::test_pages_carry_the_security_headers_and_no_scripts
      - tests/test_hr_submit.py::test_the_routes_are_the_form_the_submission_and_the_result
      - tests/test_hr_submit.py::test_the_cli_needs_a_mode_and_a_loopback_host
      - tests/test_hr_submit.py::test_a_non_ascii_token_is_refused_not_a_server_error
      - tests/test_hr_submit.py::test_the_cli_refuses_a_request_cap_outside_1_to_50
    evidence: []
    nist: [MANAGE 4.1]
    finos:
      risks: [RI-22]
      mitigations: [MI-04, MI-21]
    gaps: >-
      No sign-in: the token and origin check stop another site posting through a browser, not
      a user or process on this machine, which can read the form's token and send any origin;
      so anyone on this machine can submit as any synthetic employee (in live mode, up to the
      cap), and nothing ties a submission to the employee it names. The spend cap is per run
      of the form, in memory: restarting it resets the count, and it caps submissions, not
      dollars. Live mode has not been run against the real API in this repo's tests or CI; the
      tests use a fake client. The "synthetic data only" banner is a notice, not a check: free
      text in live mode goes to the Claude API, so a real name or condition typed there leaves
      this machine (redaction removes labelled identifiers, not names or conditions). Demo mode
      reuses the demo builder's scripted model, which matches a message by its opening words, so
      it can't take edited text. A request that stops before the rules ran keeps no message (the
      log has only its keyed hash), so the submitter has to type it again. The result page reports only on requests this run of
      the form added, from memory, so after a restart it no longer finds them (the panel still
      does).

  - id: HM-25
    name: No reply, no send
    what: >-
      The system never replies to, contacts or sends anything to anyone. hall_monitor/egress.py
      is the only module allowed an HTTP client, and a client can be made only with its two
      shipped policies; its transport refuses, before anything is sent,
      any request that isn't GET over https to www.consumerfinance.gov under the complaint API
      path (another host, port or scheme, credentials in the URL, a path that normalises
      elsewhere), never follows a redirect, and logs each refusal to the audit log as policy,
      method, host and a hash of the URL. The complaint desk's model client is guarded the same
      way to POST on the Claude API's messages endpoint (that path exactly), with retries off. Every tool is in a
      read-only catalogue (hall_monitor/no_send.py): the registry refuses at run time a manifest
      listing any other tool, or one whose name reads as sending in any naming style, approvals
      refuse to approve one, and the tool gateway takes only a plain in-process MCP server (no URL, no
