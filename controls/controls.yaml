      delivery none; verify reports a stored draft that was changed. The draft check is strict:
      a draft with any 3-digit run (a $100 figure, a year) is not kept; the complaint still goes
      to its queue (HM-27). A static check (python -m hall_monitor.no_send check), run in CI and in the
      tests, fails on mail, messaging and raw network libraries and connection calls, HTTP
      clients outside egress.py or its internals imported elsewhere, HTTP write calls (named
      methods, a constant getattr of one, or request, stream or build_request with a method
      other than GET), mail calls, fastmcp's client and proxies anywhere but the gateway, dynamic imports, os functions
      that run another program, and sending packages in pyproject.toml.
