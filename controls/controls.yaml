      working the complaint on the panel sees its codes, not what it says. A kept draft is stored in full in the evidence store (HM-25) and may quote what was
      typed, a name included: the draft check drops links, phone numbers, email addresses and
      promises, not names. Label redaction is a refusal of what the redaction patterns find, so
      a name typed in an issue still reaches the model. Routing reads the
