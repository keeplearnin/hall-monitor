  - id: HM-29
    name: Delegated passes only narrow
    what: >-
      When an agent hands work to another, the pass only narrows. hall_monitor/delegation.py
      keeps a grant book per case: code issues the first grant (the lead agent's manifest, for
      one case scope), and each handoff makes a child grant whose tools and data classes must be
      inside both the parent grant and the helper's own manifest. A handoff must be listed in
      the delegating agent's manifest (may_delegate_to, part of the approved hall pass), can't
      hand work to an agent already in the chain, and stops two handoffs below the pipeline.
      Asking for more than the parent holds is refused and logged, never trimmed. What a grant
      allots its children can't add up to more than its own allotment. A grant counts only if
      the case's book issued it, unchanged; every use checks every agent in its chain against
      the registry, so stopping the lead stops its helpers at once; closing the book ends every
      grant. The tool gateway refuses a tool call, and offers no tools, to any agent that can
      delegate or be delegated to unless it comes with a grant its case's book issued to that
      agent, and checks the tool and the data classes it returns against the grant. Every grant
      and refusal is logged (delegation_granted, delegation_refused) with IDs, the chain, tool
      names, data classes and amounts; names a model could have written are logged only if they
      are plain identifiers.
