  - id: HM-35
    name: Agents act within their grant
    what: >-
      run_agent, the one call path every agent uses, runs an agent that can delegate or be
      delegated to only under a grant from its case's book (hall_monitor/delegation.py): without
      one, or with another agent's, it is refused before any model call. Before every model call
      the book re-checks every agent in the grant's chain against the registry, so a stop on the
      lead halts its helpers between steps. Each model call is priced from its usage and charged
      to the grant (GrantBook.spend); when the grant's own spending plus what it has handed on
      reaches its allotment (including through a helper's overshoot charged up to it), it makes
      no further call, grant_budget_reached is logged once for that grant, and the run stops
      with the calls already made recorded; a grant can't hand on all of its allotment, so a
      lead always keeps some for the call that reads its helper's answer; an unpriced model can't run under a grant; spending reduces what a
      grant may hand on. The agent is offered only its grant's tools, plus, for a lead given a
      handoff runner, a hand_off tool listing the helpers its hall pass names
      (hall_monitor/handoff.py). A handoff must be exactly a helper and a non-empty task
      (anything else is refused and logged); the book makes the helper's grant, with an
      allotment set by code and every data class the lead's grant holds, so a helper not approved
      for all of them is refused; the task reaches the helper fenced and escaped; the helper's
      validated answer returns to the lead as a tool result, and a helper's failure as its
      error type only. A helper code gave no allotment is refused before any call; a grant with
      nothing left makes no further call; a second handoff to the same helper gets a fresh
      grant; what a helper spends past its allotment is charged to its parent too, so the first
      grant's spending is the case's. Every handoff's outcome (answered, refused or failed, with
      the helper's call) is kept on the runner so the caller can mark the case incomplete.
      hand_off is not an MCP tool, never reaches the gateway and sends nothing.
    status: built
    code:
      - hall_monitor/agents/base.py::run_agent
      - hall_monitor/handoff.py::HandOff
      - hall_monitor/handoff.py::handoff_definition
      - hall_monitor/delegation.py::GrantBook
      - hall_monitor/gateway/cost.py::usage_cost
