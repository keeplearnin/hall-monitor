    what: >-
      The fourth worked example, partner rebate and marketing-fund (MDF/co-op) reimbursement
      claims at a fictional hardware maker, starts with its rules in code and no model
      (hall_monitor/partners/rules.py). Every claim goes to a person: the route is compliance
      review, hold, review or expedited sign-off, and nothing in the package pays, approves or
      changes a payee. Program terms are data (data/synthetic/partners/program.yaml). Each
      outcome is a fixed reason code with a fixed text: a partner not on the approved list or
      hospitality with public-sector attendees (compliance review); no matching pre-approval,
      an activity started before approval, a claim after the 45-day window, an ineligible
      activity, an invoice issued by the partner itself, a duplicate (3 or more of invoice
      number, issuer, total, start and end matching an earlier or another claim, whoever the
      partner), a payee account other than the partner's approved one, text in the documents
      aimed at the AI (the repo's injection detector), or a partner on accounts-receivable hold
      (hold); missing evidence for the activity type, excluded costs, merchandise over $75 a
      unit (from the line's amount and units, not its stated price) or with no unit count, a
      line more than 10% over its benchmark, competitor content (30% rate), more than the
      pre-approved amount or than what earlier claims have left of it, more than the invoice
      total, invoice lines that don't add up, impossible dates, or three or more claims from one
      partner and agency within one 7-day span each within 5% under the same approval threshold
      (review). Duplicates ignore case, punctuation, leading zeros and legal suffixes. What may
      be reimbursed is computed in exact decimals, capped at the claim, the invoice total and
      the pre-approval, and reported with the amount held. The least senior role that may decide
      is the higher of the approval ladder for the amount claimed and any role a reason demands;
      a compliance reason goes to a compliance officer. A portal submission naming a partner
      the book doesn't hold gets partner_not_approved and payee_not_on_master (compliance
      review), and one naming an unknown pre-approval gets no_preapproval, rather than
      stopping with an error. python -m hall_monitor.partners scores
      the rules against hand-written answer keys for 47 claims, with boundary cases on both
      sides of every numeric rule.
    status: partial
    code:
      - hall_monitor/partners/rules.py::assess
      - hall_monitor/partners/rules.py::ClaimBook
      - hall_monitor/partners/__main__.py::main
    tests:
      - tests/test_partner_rules.py::test_each_claim_matches_its_answer_key
      - tests/test_partner_rules.py::test_every_reason_appears_in_an_answer_key
      - tests/test_partner_rules.py::test_every_route_sends_the_claim_to_a_person
      - tests/test_partner_rules.py::test_each_boundary_flags_only_the_outside_case
      - tests/test_partner_rules.py::test_exactly_ten_percent_over_benchmark_is_not_flagged_even_in_floating_point
      - tests/test_partner_rules.py::test_text_aimed_at_the_ai_in_a_document_holds_the_claim
      - tests/test_partner_rules.py::test_a_duplicate_is_found_across_partners_too
      - tests/test_partner_rules.py::test_compliance_outranks_red_and_red_outranks_yellow
      - tests/test_partner_rules.py::test_the_role_is_the_higher_of_the_ladder_and_the_reason
      - tests/test_partner_agents.py::test_a_partner_or_pre_approval_not_in_the_book_goes_to_a_person
      - tests/test_partner_agents.py::test_an_unknown_partner_still_goes_to_compliance_when_nobody_could_read_the_documents
    evidence: []
    nist: [GOVERN 1.4, MAP 3.5, MANAGE 1.3]
    finos:
      risks: [RI-22, RI-24]
      mitigations: [MI-18]
    gaps: >-
      The rules assess typed fields; the agents that read the documents and judge the proof
      are HM-37 (slice 2), and nothing runs them in a pipeline yet. No pipeline,
      audit events, panel page or evals yet; the spend check is in partner-claim preparation
      (HM-34, HM-37). The approval ladder ($5,000 /
      $25,000) and the caps are assumptions: no vendor publishes its thresholds. The answer
      keys and the program terms were written by one person, and the claims are fictional. The
      proposal stage (lead time before an activity) and the "more proof requested" cure period
      are not modelled. Accounting classification (expense or contra-revenue) stays with
      accounting staff and isn't attempted. Split detection and pre-approval use look only at the
      claims being assessed, not at paid history, which holds no claim amounts or submission
      dates. A claim already in the book with an unknown partner or pre-approval still stops the
      whole book from loading (the rules CLI's answer-key run); only a portal submission
      prepared against the book (prepare(), HM-37) is sent to a person instead. Duplicate matching normalises names but can still miss a determined
      variation (a different issuer name). retention_months is informational: no rule reads it.
      No audit events are written yet, so decisions aren't logged (slice 3).

  - id: HM-37
    name: Partner claim agents read and flag; code checks them (partner claims example)
    what: >-
      Two agents read a partner claim's documents inside the shared controls (hall pass by
      digest, approved prompt hash, data class financial only, kill switch, budgets, typed
      output, no tools). The portal's fields (partner, pre-approval, activity type, amount
      claimed, payee, upload categories) never come from a document or an agent, and neither
      agent is given them (the documents themselves may name the partner, as an invoice's
      bill-to line does). The documents are redacted,
      fenced and escaped before either agent reads them. partner_claim_intake extracts the
      invoice number, issuer, lines with unit counts, total and activity dates; code checks
      every extracted number, name and date against the documents' own text and adds
      extraction_unsupported (review) for any value that isn't there: the invoice number as a
      whole token, the issuer as a whole part of a line of the invoice's header (before any
      Bill to, Client, Ship to or similar label, so the party billed can't stand in for the
      issuer and hide a self-invoice; Client and Customer count as labels only followed by a
      colon or ending the line, so an issuer named "Customer Events LLC" is still the issuer),
      the total on the total line, each line amount on one other line, never digits from an
      identifier or a date; a line's unit count written there as a count of units ("20 units",
      "20 x", "20 @"), not one of the line's other money figures (the stated unit price aside,
      which may equal the count: "20 units at 20.00"), and, where a unit price is stated, units
      times that price equal to the line amount; and
      the activity's start and end as the pair written together ("2026-09-10 to 2026-09-13"),
      so a later start or an earlier end can't be picked from elsewhere in the documents.
      A failed intake call or nothing extracted gives extraction_failed: review, nothing
      reimbursable, the whole claim held, the reviewer not asked, and every rule finding that
      needs no invoice kept (partner status and hold, pre-approval, activity and evidence, the
      payee, text aimed at the AI), so a document that makes the agent fail can't lower the
      route. Non-finite amounts are refused by the output type, and only the agent-call
      failures (a refusal, a stop or refused hall pass, an API error, invalid output) count as
      agent failures; any other exception is raised as our own bug. Text aimed at the AI is found by code in the raw documents (HM-36), not by an
      agent. partner_proof_reviewer returns concerns from a closed list of five (recycled
      proof, edited document, vague invoice line, evidence mismatch, low brand content) and a
      confidence, with no free-text field; each concern maps to a fixed reason, tier and least
      senior role, and the result is the rules' assessment with those reasons added. The tier
      and role only go up and no rule finding is removed; an edited document needs the finance
      controller. A failed review adds review_failed and a low-confidence one review_uncertain,
      both review. Before the result is returned every agent that answered is checked again
      against the registry: a stop made while the claim was prepared discards what the agents
      said and sends it to review as agent_stopped, nothing reimbursable, the portal findings
      kept. Each claim is a case under the partners budget (HM-34): refused at a cap or with
      unapproved budgets it gets spend_refused before any model call; out of steps, money or
      time before an agent's call it gets budget_exhausted (before the intake call, nothing is
      reimbursable; before the review, the proof goes unreviewed to a person). Tested on 11
      documented claims with scripted agents against hand-written reviewer answer keys.
    status: partial
    code:
      - hall_monitor/partners/prepare.py::prepare
      - hall_monitor/partners/documents.py::check_extraction
      - hall_monitor/partners/documents.py::claim_from_extraction
      - hall_monitor/partners/intake_agent.py::run_claim_intake
      - hall_monitor/partners/review_agent.py::run_proof_review
    tests:
      - tests/test_partner_agents.py::test_both_agents_have_hall_passes_with_no_tools_and_financial_data_only
      - tests/test_partner_agents.py::test_a_stopped_intake_agent_makes_no_call_and_the_claim_goes_to_a_person
      - tests/test_partner_agents.py::test_documents_are_redacted_and_fenced_before_the_intake_agent_sees_them
      - tests/test_partner_agents.py::test_the_agents_never_get_the_portal_s_partner_payee_or_pre_approval
      - tests/test_partner_agents.py::test_an_extracted_value_not_in_the_documents_is_caught
      - tests/test_partner_agents.py::test_an_invented_amount_sends_the_claim_to_review_whatever_the_rules_say
      - tests/test_partner_agents.py::test_the_portal_fields_stay_the_portal_s
      - tests/test_partner_agents.py::test_text_aimed_at_the_ai_is_read_from_the_raw_documents_not_the_agent
      - tests/test_partner_agents.py::test_each_documented_claim_gets_the_rules_answer_plus_the_review
      - tests/test_partner_agents.py::test_the_reviewer_can_only_add_review
      - tests/test_partner_agents.py::test_a_clean_review_doesn_t_clear_a_rule_finding
      - tests/test_partner_agents.py::test_a_failed_extraction_reimburses_nothing_and_goes_to_a_person
      - tests/test_partner_agents.py::test_a_failed_review_goes_to_a_person_and_keeps_the_rules_findings
      - tests/test_partner_agents.py::test_a_failed_extraction_keeps_the_portal_rule_findings
      - tests/test_partner_agents.py::test_a_truncated_invoice_number_or_issuer_is_caught
      - tests/test_partner_agents.py::test_inflated_units_are_caught
      - tests/test_partner_agents.py::test_digits_from_the_invoice_number_or_a_date_are_not_an_amount
      - tests/test_partner_agents.py::test_the_total_must_be_the_invoice_s_total_line
      - tests/test_partner_agents.py::test_our_own_bug_is_not_passed_off_as_an_agent_failure
      - tests/test_partner_agents.py::test_the_line_amount_or_unit_price_is_not_a_unit_count
      - tests/test_partner_agents.py::test_a_money_figure_as_the_unit_count_can_t_dodge_the_merchandise_cap
      - tests/test_partner_agents.py::test_units_times_the_stated_unit_price_must_make_the_line_amount
      - tests/test_partner_agents.py::test_activity_dates_must_be_the_pair_written_on_the_activity_line
      - tests/test_partner_agents.py::test_the_bill_to_party_is_not_the_issuer
      - tests/test_partner_agents.py::test_an_issuer_named_customer_or_client_is_still_the_issuer
      - tests/test_partner_agents.py::test_units_equal_to_the_unit_price_still_count
      - tests/test_partner_agents.py::test_a_stop_made_after_the_intake_agent_answered_sends_the_claim_to_a_person
      - tests/test_partner_agents.py::test_a_stop_on_the_reviewer_after_it_answered_keeps_the_portal_findings
      - tests/test_partner_agents.py::test_a_partner_claim_over_the_daily_cap_makes_no_model_call_and_goes_to_a_person
      - tests/test_partner_agents.py::test_a_case_out_of_steps_skips_the_reviewer_and_goes_to_review
    evidence: []
    nist: [MAP 3.5, MEASURE 2.7, MANAGE 1.3]
    finos:
      risks: [RI-01, RI-22, RI-24]
      mitigations: [MI-03, MI-18]
    gaps: >-
      Scripted agents only: no live run has measured either agent, so there are no accuracy
      numbers yet (slice 4). Three things the intake agent returns are trusted, not checked
      against the text: each line's category (the benchmarks and exclusions follow it), and
      the two yes-or-no flags, competitor content and public-sector attendees. A dropped flag
      changes money or routing: C-104 without competitor content would be green at $6,000
      instead of $1,800, and C-107 without public-sector attendees green instead of compliance
      review. Either way a person still signs, but on the wrong route; slice 4 measures how
      often it happens. Only the unit count, the activity dates and the issuer were tightened in
      review 38; these flags and the categories are still trusted. The checks assume an invoice
      laid out in lines with a total line; an issuer run into other text, or a total on a line
      not saying "total", goes to review. Unit counts and date pairs are recognised only in
      the forms the synthetic documents use ("20 units", "A to B"); other forms go to review.
      A start date that isn't the written pair sends the claim to review as
      extraction_unsupported, but the rules don't re-derive activity_before_approval from the
      written dates: C-105 extracted with a later start than written is yellow (review), not
      the red (hold) it gets when read correctly. The partners case budget is an estimate:
      neither agent has been run live.
      Redaction is pattern-based: it removes emails, phone numbers, cards, IBANs and similar
      identifiers, not people's names, so a real attendee list naming its guests would reach
      agents declared financial-only (the synthetic lists hold counts only). The reviewer's
      answer keys cover 11 claims and were written by one person. No pipeline, audit events or
      panel page yet (slices 3 and 5).

# What this repo does not address, and why. NIST MEASURE 1.1 asks for this to be documented.


not_covered:
  - ref: GOVERN 1.1
    why: Legal and regulatory requirements for claims handling aren't analysed; this is a reference implementation, not legal advice.
  - ref: GOVERN 1.5
    why: CI checks every change, but nothing schedules periodic review of the risk process or its outcomes.
  - ref: GOVERN 4.1
    why: Organisational culture and practices are outside a codebase.
  - ref: GOVERN 6.1
    why: Third-party policies, including intellectual-property risk from the model provider, aren't addressed; the model is pinned, not assessed.
  - ref: MAP 4.1
    why: Legal and intellectual-property risks of third-party components aren't mapped.
  - ref: RI-02
    why: There is no vector store or retrieval index.
  - ref: RI-08
    why: Tampering with the foundation model is the provider's control; the repo only pins the model.
  - ref: RI-09
    why: There is no training or fine-tuning, so no training data to poison.
  - ref: RI-20
    why: Reputational risk is a business judgement; publishing results, failures included, is the only part this repo touches.
  - ref: RI-23
    why: Intellectual property in model output isn't assessed.
  - ref: RI-26
    why: >-
      The MCP server is first-party and runs in-process; nothing checks a third-party server's
      integrity because there isn't one. The gateway refuses a URL or a proxy (HM-25), so there is
      no HTTP transport whose Mcp-Method header could disagree with its JSON-RPC body; one would
      need that check before it is added.
  - ref: RI-27
    why: >-
      Workflow checkpoints are local state. The evidence pack and triage result in a checkpoint are
      checked against the hashes in the audit log (HM-05); other checkpoint state isn't
      integrity-checked.
  - ref: RI-29
    why: >-
      Agents hold no credentials; the API key stays in the host process. With no remote MCP
      server there is no bearer token, so token audience (RFC 8707 resource indicators), expiry
      and tenant claims aren't checked; an HTTP transport would need all of them before it is
      added.
  - ref: RI-30
    why: The system loads no skills or plugins.
  - ref: MI-02
    why: There is no external knowledge base or retrieval; the policy wording is fixed reference text.
  - ref: MI-07
    why: Legal and contractual terms with the model provider are out of scope.
  - ref: MI-23
    why: Agents hold no credentials (see RI-29), so there is nothing for them to protect.
  - ref: MI-11
    why: Adjuster overrides are recorded but not fed back into prompts, answer keys or evals.
  - ref: MI-08
    why: There is no rate limiting or denial-of-service protection; nothing is exposed as a service.
  - ref: MI-14
    why: The audit log and checkpoints are unencrypted SQLite files.
  - ref: MI-22
    why: Agents run in one process; they're separated by allow-lists and claim scope, not isolation.
  - ref: MI-25
    why: The system loads no skills or plugins (see RI-30).

