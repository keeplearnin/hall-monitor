# hall-monitor controls register.
#
# Every control names its code and the tests that prove it, lists its published evidence where
# there is any (an empty list where there is none yet), and maps to NIST AI RMF 1.0
# subcategories and FINOS AI Governance Framework risks and mitigations. Only
# identifiers listed in controls/frameworks.yaml (verified against the sources) are allowed.
# docs/controls.md is generated from this file: uv run python -m hall_monitor.governance.controls
#
# References: code and tests are "path" or "path::symbol"; the symbol must be defined in that file.
# Evidence is a path to a published result, or "pending: <command>" when it needs a live run.

controls:
  - id: HM-01
    name: Agent registry and approvals
    what: >-
      Every agent has a typed manifest naming its owner (a person listed in registry/owners.yaml,
      never a team), risk tier, status, model, tools and data classes. Unregistered, inactive or unapproved agents are refused at run time: the manifest
      digest and the system-prompt template hash must match registry/approvals.yaml, and the
      template hash is recorded on every call. CI fails on an unapproved change.
    status: built
    code:
      - hall_monitor/registry.py::Registry
      - hall_monitor/approvals.py::current_approvals
      - registry/approvals.yaml
    tests:
      - tests/test_registry.py::test_unregistered_agent_is_refused
      - tests/test_registry.py::test_unapproved_manifest_is_refused
      - tests/test_registry.py::test_approvals_match_the_current_manifests_and_prompts
      - tests/test_registry.py::test_unapproved_prompt_is_refused_at_run_time
      - tests/test_registry.py::test_the_approved_prompt_covers_the_untrusted_claim_notice
    evidence: []
    nist: [GOVERN 1.6, GOVERN 2.1, MAP 1.1, MANAGE 2.4]
    finos:
      risks: [RI-05, RI-18]
      mitigations: [MI-10]
    gaps: >-
      Anyone who can commit can regenerate approvals.yaml. Review of that change depends on
      repository settings: .github/CODEOWNERS names an owner, but main has no branch protection
      yet, so it isn't enforced. Approvals pin each system-prompt template (the untrusted-claim
      notice included since review 6), but not the policy wording filled into it: an edit to
      the wording file changes what the coverage and critic agents are sent without a new
      approval. Nor do they pin the output
      schema the model is given, so a change to an output model (a new field constraint, say)
      needs no new approval; the API passes pydantic patterns to the model as description
      text, not as constraints, and they are checked only once the answer is back. Nor do they
      pin how the claim and earlier answers are rendered into the request (render_claim,
      escape): a change there, such as escaping ampersands in review 6, changes what the model
      receives without a new approval or making published results stale. Nor do they pin the
      tool definitions the model is offered (the MCP tools' descriptions in claims/tool_server.py,
      sent through ToolGateway.definitions) or the reviewer-feedback instructions written by
      render_feedback: an edit to either changes what the model reads without a new approval.
      The owner is checked against the list of people when the registry
      loads, and the kill switch (HM-19) records the owner ID given for each stop; risk tier is an inventory
      field that nothing reads at run time.

  - id: HM-02
    name: Pinned models, no silent fallback
    what: >-
      Each call uses the model its approved manifest names. A refusal or outage never switches to
      another model; the claim stops and goes to a person.
    status: built
    code:
      - hall_monitor/agents/base.py::run_agent
    tests:
      - tests/test_pipeline.py::test_every_call_records_what_ran
      - tests/test_pipeline.py::test_api_error_stops_the_claim
      - tests/test_cost_routing.py::test_routing_is_off_by_default
    evidence: []
    nist: [MANAGE 3.1]
    finos:
      risks: [RI-05]
      mitigations: [MI-10]
    gaps: No fallback model, so a provider outage stops claims; availability is an accepted risk.

  - id: HM-03
    name: Tool gateway with allow-list and claim scope
    what: >-
      Agents read policy records and claims history only through MCP tools behind a gateway. Each
      agent is offered only the tools its manifest allows, every call is checked again, lookups are
      limited to the claim's own policy, and every call, allowed or refused, is recorded. An agent
      given no claim scope may not call a tool that takes a policy number, so code that forgets
      the scope fails closed. Arguments the tool's schema doesn't name (an MCP-style _meta, a
      tenant, a scope or actor of the model's own) are refused before the server is called and
      never recorded, and the actor is always the agent code runs, never one the model names. A
      tool name is matched exactly (case, invisible characters and look-alike letters included),
      a tool missing from the server's data-class table counts as returning every class, and a
      grant counts only in the book that issued it. A record copies a tool name only if the
      server, the pipeline or a reviewed manifest declares it (any other shows as "<not a known
      tool>", in the refusal too), and a call that fails after it was allowed records the
      exception's type, never its message, which can quote a record (review 46).
    status: built
    code:
      - hall_monitor/tools/gateway.py::ToolGateway
      - hall_monitor/claims/gateway.py::claims_gateway
      - hall_monitor/claims/tool_server.py::build_server
    tests:
      - tests/test_tools.py::test_agents_are_offered_only_their_allowed_tools
      - tests/test_tools.py::test_call_outside_the_allow_list_is_refused_and_recorded
      - tests/test_privacy_security.py::test_a_lookup_outside_the_claims_policy_is_refused
      - tests/test_tools.py::test_a_tool_call_that_fails_after_it_was_allowed_is_still_recorded
      - tests/test_tools.py::test_agents_are_offered_only_tools_their_data_classes_allow
      - tests/test_tools.py::test_the_gateway_works_inside_a_running_event_loop
      - tests/test_gateway_adversarial.py::test_an_agent_call_without_a_claim_scope_is_refused_for_policy_tools
      - tests/test_gateway_adversarial.py::test_arguments_outside_the_tool_schema_are_refused_at_the_gateway
      - tests/test_gateway_adversarial.py::test_a_meta_tenant_or_scope_in_arguments_never_widens_the_lookup
      - tests/test_gateway_adversarial.py::test_a_model_claiming_to_be_the_pipeline_in_tool_input_changes_nothing
      - tests/test_gateway_adversarial.py::test_a_tool_name_differing_by_case_or_invisible_characters_is_refused
      - tests/test_gateway_adversarial.py::test_a_tool_missing_from_the_data_class_table_counts_as_carrying_every_class
      - tests/test_gateway_adversarial.py::test_a_grant_replayed_into_a_new_book_for_the_same_case_is_refused
      - tests/test_gateway_adversarial.py::test_a_tool_the_server_lacks_is_refused_before_the_server
      - tests/test_gateway_adversarial.py::test_a_scope_refusal_does_not_quote_the_asked_value
      - tests/test_gateway_adversarial.py::test_a_result_that_breaks_screening_is_still_recorded
      - tests/test_tools.py::test_a_tool_name_no_one_declared_is_never_copied_into_the_record
      - tests/test_argument_redaction.py::test_an_argument_value_not_in_its_declared_shape_is_never_recorded
      - tests/test_argument_redaction.py::test_what_the_gateway_decided_is_kept_when_the_value_is_withheld
      - tests/test_argument_redaction.py::test_a_policy_number_is_recorded_as_the_gateway_compared_it
      - tests/test_argument_redaction.py::test_an_allowed_out_of_scope_lookup_is_still_visible_to_the_adversarial_eval
      - tests/test_argument_redaction.py::test_a_gateway_that_declares_no_shapes_records_no_values
    evidence: []
    nist: [GOVERN 1.4, MEASURE 2.7, MANAGE 1.3]
    finos:
      risks: [RI-24, RI-25]
      mitigations: [MI-12, MI-16, MI-18, MI-19, MI-20]
    gaps: >-
      A call's record keeps an argument's value only in the shape its example declares, in the
      form the gateway compares (claims: a policy number as WTP-ESS-123456, trimmed and
      upper-cased; the desk: the shapes its CFPB tool accepts); any other value, and every value
      of an argument with no declared shape, is only named, and the audit log alone keeps a
      keyed hash of it, so the record shows which arguments were passed and what the gateway
      decided but not the text. A value in the declared shape is still the model's: a
      well-formed policy number for another customer is kept, as the refusal of it is. Arguments a tool doesn't take are dropped, and refusals don't quote the value asked
      for. A tool name a model sends in another case or with invisible
      characters is refused by the no-send check, whose message says the tool could send,
      before the allow-list sees it: refused either way, with a misleading reason. Claims history links policies by the insured's name (there's no customer ID in the data), so
      two customers with the same name would see each other's history; production would use a
      customer identifier.

  - id: HM-04
    name: Routing to a person, decided in code
    what: >-
      A code rule, not a model, decides whether a person must decide. It checks the facts behind
      the agents' labels: denials, payouts above $2,500 or above the amount claimed, any fraud
      flag or non-low risk, critic changes, unresolved critic disagreement, injection signals
      and any tool result that addresses the AI (one held back from an agent, or the pipeline's
      own lookup), named in the reasons of a claim that stopped too. Against the policy record it checks in code that the claimant is the insured (names compared
      ignoring case, accents and punctuation), the incident
      falls inside the coverage period and the claim is in USD. The claim documents must name
      both the policy number and the claimant, and no other policy number (a companion's
      policy named beside the claimant's goes to a person); a policy number the claim doesn't
      name is never looked up (code uses the claim's own; numbers are found however written,
      with spaces or a line break for a hyphen), so an agent can't point the claim, or the
      specialists' lookups, at another customer's policy without a person checking (review 46). A claim with no policy record,
      no incident date or another currency goes to a person. Against the claim documents it
      checks that each claimed item matches its own occurrence of that figure, that the total claimed
      appears in them, and that the items add up to the total. Only figures the documents mark as
      US dollars count ($, US$ or USD on the same line beside them, with no other currency code
      or symbol and no minus sign touching the mark), and never part of a date, a time or a
      reference, so a year read as the claim, or a claim in euros or Canadian dollars the
      intake labels USD, goes to a person. Another currency counts beside the mark or after the
      figure: any three-capital code but USD, and a list of dollar and peso codes, prefixes and
      names in any case (HK $450, NZ $450, (CAD) $450, Cdn. $450, $450 cad, $450 in CAD, $450
      Canadian), with any spaces (non-breaking ones too) or punctuation between. A refund
      followed by CR doesn't count, like one with a minus sign, nor does one written as an
      accounting negative (($200.00), (USD 200.00)) when the bracketed figure stands alone at
      the end of its line or the line says refund, credit or return; prices listed in brackets
      in a narrative ("a suit ($480.00), shoes ($220.00)") still count. A currency the documents
      name (C$ or another prefixed dollar, €, £, ¥ and other signs, or a common currency code,
      anywhere; a currency's name only next to a figure or after a header phrase such as "all
      amounts in CAD", "currency: sterling" or "converted from yen"; and codes that are also
      English words, PEN, SAR, COP and PHP, only in those places too) means a bare "$" may be
      that currency, so
      only figures marked USD or US$ count then, and a figure that doesn't trace gets its own
      reason naming the currencies found ("claimed amounts not in the claim documents marked
      USD (they name ...)"); a total written with a bare "$" still traces when every item is
      marked USD and they add up to it. The lists are a backstop behind the intake's label and
      the senior-adjuster rule for claims not in USD, not a currency parser. In the workflow,
      a claim whose documents match an earlier claim's under another claim ID on the same
      policy goes to an adjuster (duplicate_documents): each triage result, stopped ones
      included, records a keyed hash (documents_hmac) of the attachment texts, normalised for
      case, spacing and order, scoped by the policy numbers code finds in the claim as sent (the
      documents alone when it names none), never by the agent's extraction, so a claim stopped
      before intake or with no policy number is hashed and checked too; the next claim's is
      compared with the results already logged.
    status: built
    code:
      - hall_monitor/claims/routing.py::route_claim
    tests:
      - tests/test_pipeline.py::test_anything_but_a_clean_small_payment_goes_to_an_adjuster
      - tests/test_pipeline.py::test_facts_checked_against_the_policy_send_the_claim_to_a_person
      - tests/test_pipeline.py::test_a_policy_or_claimant_the_documents_dont_name_goes_to_a_person
      - tests/test_pipeline.py::test_another_customers_policy_named_by_intake_is_never_looked_up
      - tests/test_pipeline.py::test_a_claim_naming_two_policies_goes_to_a_person_when_intake_picks_the_other
      - tests/test_pipeline.py::test_a_policy_number_written_with_spaces_or_a_break_is_still_found
      - tests/test_data.py::test_route_follows_routing_rule
      - tests/test_agent_faults.py::test_a_wrong_answer_sends_the_claim_to_a_person
      - tests/test_agent_faults.py::test_a_claim_in_another_currency_labelled_usd_goes_to_a_person
      - tests/test_scoring.py::test_the_routing_trace_only_counts_dollar_amounts
      - tests/test_scoring.py::test_another_currency_named_anywhere_in_the_documents_is_found
      - tests/test_scoring.py::test_ordinary_us_receipts_name_no_other_currency
      - tests/test_scoring.py::test_a_claim_whose_documents_name_another_currency_goes_to_a_person
      - tests/test_scoring.py::test_figures_marked_usd_still_trace_when_another_currency_is_named
      - tests/test_workflow.py::test_the_same_receipts_under_a_new_claim_id_go_to_an_adjuster
      - tests/test_workflow.py::test_different_receipts_on_the_same_policy_are_not_flagged
      - tests/test_workflow.py::test_a_claim_is_not_a_duplicate_of_its_own_earlier_run
      - tests/test_workflow.py::test_a_stopped_claim_with_no_policy_number_still_goes_to_an_adjuster
      - tests/test_workflow.py::test_refiling_a_claim_whose_first_triage_stopped_is_still_caught
      - tests/test_scoring.py::test_an_item_listed_in_parentheses_in_the_narrative_still_traces
      - tests/test_scoring.py::test_wont_and_hotel_names_dont_make_a_us_claim_strict
      - tests/test_scoring.py::test_currency_names_next_to_a_figure_or_in_a_header_are_still_found
      - tests/test_agent_faults.py::test_known_limit_a_missed_fraud_signal_routes_automatically
      - tests/test_agent_faults.py::test_known_limit_an_overpayment_within_the_claim_routes_automatically
    evidence:
      - evals/results/hardened-critic/findings.md
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 1.3]
    finos:
      risks: [RI-22, RI-24]
      mitigations: [MI-24]
    gaps: >-
      The incident date is still the intake's: it is checked against the coverage period, not
      against the documents. The claimant check finds the name anywhere in the documents, so a
      claim filed by someone else that mentions the insured passes it when the intake names the
      insured as the claimant. A critic's change to the claimant or the currency isn't a
      routing reason or in the revision record (review 46, open). A wrong answer that agrees with every fact the rule checks still routes automatically: a
      risk step that misses a fraud signal, or a coverage step that ignores a limit but pays no
      more than was claimed and no more than $2,500. Tests pin both. The amount trace checks the
      agents' figures against what the claimant sent, not the claimant's own figures, and a figure
      written in both the narrative and a receipt counts twice, so wrong items whose total happens
      to appear in the documents as dollars would pass it. The currency comes from the claimant's
      own marks: a bare "$" the claimant uses for another currency is taken as USD when no other
      currency is named anywhere in the documents, and the codes and names found anywhere are a
      fixed list of common currencies (a rarer one isn't). Names count only next to a figure or
      after a header phrase, and "in" is one: "stayed in Euro House" names EUR, which errs
      towards review; "won" and "rand" count only as "Korean won" and "South African rand". A
      bracketed price on a line that says return or credit for another reason ("returned to the
      store ($480.00), ...") doesn't trace, so that claim goes to a person. A
      refund written with a spaced dash (– $20.00, which is also how item lists are written)
      traces as $20. An unrelated three-capital word beside a figure ($45.00 ATM fee, VAT
      $9.00) stops it tracing, so that claim goes to a person. The duplicate-documents check
      runs only in the workflow (evals and a direct triage() pass no log, so they don't check),
      only once a triage has finished (two claims with the same documents triaged at the same
      time can both miss each other), only when the refiled claim names the same set of policy
      numbers in its text (a refiling that names an extra or a different one, or drops it, is
      scoped differently and isn't matched), and only on the attachments, not the narrative; an
      attachment changed by one character no longer matches.

  - id: HM-05
    name: Adjuster approval gate
    what: >-
      Claims routed to a person pause in a LangGraph workflow with state saved in SQLite. A
      decision must be signed with the adjuster's Ed25519 key over the claim, its fields and the
      evidence hash; come from a registered adjuster within their authority; quote the hash of
      the evidence pack the claim was paused with, which must match the pack stored under that
      hash in the audit database; on a USD claim pay no more than was claimed, and give a reason for any override or
      denial. Only senior adjusters may pay a claim with a fraud flag or above-low risk, or one the
      AI never assessed for fraud (a stopped claim); denying more than an adjuster's authority, or
      paying or denying a claim whose amount can't be compared with USD limits (not in USD,
      nothing extracted, a claimed total the routing rule didn't trace to the documents, or a
      claim that stopped, or that the agentic supervisor ended with steps missing, before it was
      checked: the limits never rest on the intake's reading alone, review 46), also needs a
      senior adjuster.
      The adjuster is shown the stored pack, with a warning if the checkpoint no longer matches
      it. A decision signed with a public demo key is marked as such in the record. A claim gets
      one evidence pack and one final decision: the audit log refuses a second of either inside
      the same write transaction, so a second run, two adjusters at once, or a checkpoints file
      restored from a backup can't have its result recorded or decide or pay the claim again. The log, not the
      checkpoint, says whether and how a claim was decided: a decision in the checkpoint that
      the log doesn't hold, or that differs from it, is reported as a problem. A claim whose
      evidence pack the log holds but whose checkpoint has no result is reported as needing a
      person. The review CLI refuses an invalid decision (a negative payout or NaN, say)
      with a message naming the fields. The adjusters file (registry/adjusters.yaml) is
      approved by digest in registry/approvals.yaml, like the budgets, and read again at each
      decision: while it isn't the approved version, or it or approvals.yaml doesn't load,
      every decision is rejected. It is refused whole if an ID is listed twice or an authority limit isn't a
      finite number above 0 (a NaN limit would let any payout pass).
    status: built
    code:
      - hall_monitor/claims/workflow.py::build_graph
      - hall_monitor/claims/approval.py::validate_decision
      - hall_monitor/claims/routing.py::claimed_total_traced
      - hall_monitor/governance/signing.py::verify
      - hall_monitor/claims/workflow.py::_check_evidence
      - registry/adjusters.yaml
    tests:
      - tests/test_workflow.py::test_claim_waits_for_an_adjuster_across_a_restart
      - tests/test_workflow.py::test_payout_above_authority_needs_a_senior_adjuster
      - tests/test_workflow.py::test_decisions_that_break_the_rules_are_rejected
      - tests/test_workflow.py::test_a_decision_counts_only_with_the_adjusters_signature
      - tests/test_workflow.py::test_an_edited_checkpoint_cant_change_the_evidence
      - tests/test_workflow.py::test_the_adjuster_is_shown_the_stored_evidence_not_an_edited_checkpoint
      - tests/test_workflow.py::test_an_edited_checkpoint_result_cant_relax_the_approval_rules
      - tests/test_workflow.py::test_run_fresh_refuses_a_claim_that_finished_triage
      - tests/test_workflow.py::test_a_claim_the_log_shows_triaged_cant_be_triaged_again_with_new_checkpoints
      - tests/test_workflow.py::test_two_runs_of_the_same_claim_at_once_pay_it_once
      - tests/test_workflow.py::test_two_adjusters_deciding_at_once_decide_once
      - tests/test_workflow.py::test_a_restored_checkpoints_file_cant_decide_a_claim_again
      - tests/test_workflow.py::test_entries_appended_to_the_log_cant_relax_the_approval_rules
      - tests/test_workflow.py::test_a_checkpoint_decision_the_log_doesnt_hold_isnt_reported_decided
      - tests/test_workflow.py::test_two_runs_of_a_claim_for_review_leave_it_decidable
      - tests/test_workflow.py::test_a_claim_whose_pack_was_logged_but_not_saved_needs_a_person
      - tests/test_workflow.py::test_cli_refuses_an_impossible_payout_without_a_traceback
      - tests/test_approval_rules.py::test_paying_a_claim_the_ai_never_assessed_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_denying_more_than_your_authority_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_a_demo_key_signature_is_marked_in_the_record
      - tests/test_approval_rules.py::test_a_claim_not_in_usd_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_paying_a_risky_claim_with_no_flags_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_a_bad_adjusters_file_is_refused
      - tests/test_approval_rules.py::test_the_shipped_adjusters_are_approved
      - tests/test_approval_rules.py::test_a_changed_adjusters_file_is_not_approved
      - tests/test_approval_rules.py::test_an_unreadable_approvals_file_refuses_the_adjusters
      - tests/test_approval_rules.py::test_a_claimed_total_the_documents_dont_support_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_denying_a_claim_that_stopped_before_its_amounts_were_checked_needs_a_senior
      - tests/test_workflow.py::test_a_decision_is_rejected_while_the_adjusters_file_isnt_approved
    evidence:
      - evals/results/hardened-critic/override.json
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 4.1]
    finos:
      risks: [RI-22]
      mitigations: [MI-24]
    gaps: >-
      A payout on a claim not in USD, or with no amount extracted or traced, is capped only by
      the senior adjuster's authority, and a senior adjuster's denial of such a claim has no
      limit at all: nothing converts currency or bounds it by the claim (review 46, open).
      The fictional adjusters' keys are public demo keys (decisions signed with them are marked);
      a deployment would issue keys from the firm's identity system. The evidence pack lists document names rather than the documents.
      The evidence pack and the triage result the approval rules read are checked against the
      hashes the audit log recorded at triage (the pack's entry names the result it was built
      from; a second pack appended by hand makes the claim undecidable rather than replacing
      it); other checkpoint state isn't. Two runs of one claim at once both call the agents and
      both record their agent and tool calls before the second fails, so the log shows a run
      whose result wasn't recorded. A signed decision
      carries no nonce, so if a claim were ever triaged again with an identical pack, an earlier
      signature for it would verify again; the workflow refuses a second triage of any claim
      the audit log shows finished, whatever the checkpoint file holds. A crash after the
      evidence pack is logged but before the checkpoint is saved leaves that claim for a person
      to handle: its status says needs_a_person, and the workflow can't restart or decide it.
      Read from another process in the moment between those two writes, a claim still
      finishing normally also shows needs_a_person.
      An adjuster's request_information or investigate is recorded as the claim's final
      decision, so the workflow has no path to triage it again with new documents or decide it
      again; a follow-up has to be handled outside it. The run and review CLIs take
      --checkpoints but always open the default audit log (var/audit.sqlite); no option or
      environment variable selects another (only open_workflow's audit_db argument does, in
      code). Since the log decides a claim's state, checkpoint files used side by side share
      one log, and a claim the log shows triaged can't be triaged from another checkpoints
      file. The override rate is simulated with an answer-key adjuster; no real adjusters yet.
      The workflow reads the adjusters file and its approval from the shipped registry
      directory, whatever registry a run is given. The review CLI still reads the adjusters
      file unpinned, only to say whether the adjuster signs with a demo key; whether the
      decision counts is the workflow's check against the approved file.

  - id: HM-06
    name: Tamper-evident audit log
    what: >-
      Each claim's triage (agent calls, tool calls, critic reviews, revisions, corrections, result)
      and every adjuster decision are written, as they happen, to an append-only SQLite log in
      which each entry's hash covers the previous one. Triggers refuse edits and deletes, and
      verify reports any changed, missing or reordered entry, any stored evidence pack that no
      longer matches its hash, any signed HR decision record the log refers to that was changed
      (one no longer stored is listed apart, as decision_records_erased, like an erased
      evidence pack), and (opened read-only, as the audit CLI does) any trigger someone removed
      or replaced with one of the same name: the stored trigger SQL is compared with the
      expected SQL, not only the names. Entries hold no claim narrative or documents; the adjuster's written reason, critic
      issues, a rejected submission, each agent call's hash of what the agent was sent and each
      tool call's hash of its result are kept as keyed hashes (HMAC-SHA256), so the hashes alone
      can't confirm a guess (but see the gaps on signatures). Traces leave the input hash out. Every read and write takes the same lock.
    status: built
    code:
      - hall_monitor/governance/audit.py::AuditLog
      - hall_monitor/audit.py::main
    tests:
      - tests/test_audit.py::test_a_changed_entry_is_detected
