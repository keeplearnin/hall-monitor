# hall-monitor controls register.
#
# Every control names its code, the tests that prove it, and its published evidence, and maps to
# NIST AI RMF 1.0 subcategories and FINOS AI Governance Framework risks and mitigations. Only
# identifiers listed in controls/frameworks.yaml (verified against the sources) are allowed.
# docs/controls.md is generated from this file: uv run python -m hall_monitor.governance.controls
#
# References: code and tests are "path" or "path::symbol"; the symbol must be defined in that file.
# Evidence is a path to a published result, or "pending: <command>" when it needs a live run.

controls:
  - id: HM-01
    name: Agent registry and approvals
    what: >-
      Every agent has a typed manifest naming its owner (a person listed in registry/owners.yaml,
      never a team), risk tier, status, model, tools and data classes. Unregistered, inactive or unapproved agents are refused at run time: the manifest
      digest and the system-prompt template hash must match registry/approvals.yaml, and the
      template hash is recorded on every call. CI fails on an unapproved change.
    status: built
    code:
      - hall_monitor/registry.py::Registry
      - hall_monitor/approvals.py::current_approvals
      - registry/approvals.yaml
    tests:
      - tests/test_registry.py::test_unregistered_agent_is_refused
      - tests/test_registry.py::test_unapproved_manifest_is_refused
      - tests/test_registry.py::test_approvals_match_the_current_manifests_and_prompts
      - tests/test_registry.py::test_unapproved_prompt_is_refused_at_run_time
    evidence: []
    nist: [GOVERN 1.6, GOVERN 2.1, MAP 1.1, MANAGE 2.4]
    finos:
      risks: [RI-05, RI-18]
      mitigations: [MI-10]
    gaps: >-
      Anyone who can commit can regenerate approvals.yaml. Review of that change depends on
      repository settings: .github/CODEOWNERS names an owner, but main has no branch protection
      yet, so it isn't enforced. Approvals pin each system-prompt template, not the output
      schema the model is given, so a change to an output model (a new field constraint, say)
      needs no new approval; the API passes pydantic patterns to the model as description
      text, not as constraints, and they are checked only once the answer is back. Nor do they
      pin how the claim and earlier answers are rendered into the request (render_claim,
      escape): a change there, such as escaping ampersands in review 6, changes what the model
      receives without a new approval or making published results stale. The owner is checked against the list of people when the registry
      loads, and the kill switch (HM-19) records the owner ID given for each stop; risk tier is an inventory
      field that nothing reads at run time.

  - id: HM-02
    name: Pinned models, no silent fallback
    what: >-
      Each call uses the model its approved manifest names. A refusal or outage never switches to
      another model; the claim stops and goes to a person.
    status: built
    code:
      - hall_monitor/agents/base.py::run_agent
    tests:
      - tests/test_pipeline.py::test_every_call_records_what_ran
      - tests/test_pipeline.py::test_api_error_stops_the_claim
      - tests/test_cost_routing.py::test_routing_is_off_by_default
    evidence: []
    nist: [MANAGE 3.1]
    finos:
      risks: [RI-05]
      mitigations: [MI-10]
    gaps: No fallback model, so a provider outage stops claims; availability is an accepted risk.

  - id: HM-03
    name: Tool gateway with allow-list and claim scope
    what: >-
      Agents read policy records and claims history only through MCP tools behind a gateway. Each
      agent is offered only the tools its manifest allows, every call is checked again, lookups are
      limited to the claim's own policy, and every call, allowed or refused, is recorded.
    status: built
    code:
      - hall_monitor/tools/gateway.py::ToolGateway
      - hall_monitor/tools/server.py::build_server
    tests:
      - tests/test_tools.py::test_agents_are_offered_only_their_allowed_tools
      - tests/test_tools.py::test_call_outside_the_allow_list_is_refused_and_recorded
      - tests/test_privacy_security.py::test_a_lookup_outside_the_claims_policy_is_refused
      - tests/test_tools.py::test_a_tool_call_that_fails_after_it_was_allowed_is_still_recorded
      - tests/test_tools.py::test_agents_are_offered_only_tools_their_data_classes_allow
      - tests/test_tools.py::test_the_gateway_works_inside_a_running_event_loop
    evidence: []
    nist: [GOVERN 1.4, MEASURE 2.7, MANAGE 1.3]
    finos:
      risks: [RI-24, RI-25]
      mitigations: [MI-12, MI-16, MI-18, MI-19, MI-20]
    gaps: >-
      Tool arguments are logged as the model wrote them, so a manipulated call's text is kept.
      Claims history links policies by the insured's name (there's no customer ID in the data), so
      two customers with the same name would see each other's history; production would use a
      customer identifier.

  - id: HM-04
    name: Routing to a person, decided in code
    what: >-
      A code rule, not a model, decides whether a person must decide. It checks the facts behind
      the agents' labels: denials, payouts above $2,500 or above the amount claimed, any fraud
      flag or non-low risk, critic changes, unresolved critic disagreement and injection signals.
      Against the policy record it checks in code that the claimant is the insured (names compared
      ignoring case, accents and punctuation), the incident
      falls inside the coverage period and the claim is in USD; a claim with no policy record,
      no incident date or another currency goes to a person. Against the claim documents it
      checks that each claimed item matches its own occurrence of that figure, that the total claimed
      appears in them, and that the items add up to the total. Only figures the documents mark as
      US dollars count ($, US$ or USD on the same line beside them, with no other currency code
      or symbol and no minus sign next to them), and never part of a date, a time or a
      reference, so a year read as the claim, or a claim in euros or Canadian dollars the
      intake labels USD, goes to a person.
    status: built
    code:
      - hall_monitor/governance/routing.py::route_claim
    tests:
      - tests/test_pipeline.py::test_anything_but_a_clean_small_payment_goes_to_an_adjuster
      - tests/test_pipeline.py::test_facts_checked_against_the_policy_send_the_claim_to_a_person
      - tests/test_data.py::test_route_follows_routing_rule
      - tests/test_agent_faults.py::test_a_wrong_answer_sends_the_claim_to_a_person
      - tests/test_agent_faults.py::test_a_claim_in_another_currency_labelled_usd_goes_to_a_person
      - tests/test_scoring.py::test_the_routing_trace_only_counts_dollar_amounts
      - tests/test_agent_faults.py::test_known_limit_a_missed_fraud_signal_routes_automatically
      - tests/test_agent_faults.py::test_known_limit_an_overpayment_within_the_claim_routes_automatically
    evidence:
      - evals/results/hardened-critic/findings.md
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 1.3]
    finos:
      risks: [RI-22, RI-24]
      mitigations: [MI-24]
    gaps: >-
      A wrong answer that agrees with every fact the rule checks still routes automatically: a
      risk step that misses a fraud signal, or a coverage step that ignores a limit but pays no
      more than was claimed and no more than $2,500. Tests pin both. The amount trace checks the
      agents' figures against what the claimant sent, not the claimant's own figures, and a figure
      written in both the narrative and a receipt counts twice, so wrong items whose total happens
      to appear in the documents as dollars would pass it. The currency comes from the claimant's
      own marks: a bare "$" the claimant uses for another currency, with no code or prefix beside
      it (C$, CAD $, $450 CAD), is taken as USD, and a currency named elsewhere in the document
      (a header saying "all amounts in CAD") isn't read. A refund written as ($20.00) traces as
      $20.

  - id: HM-05
    name: Adjuster approval gate
    what: >-
      Claims routed to a person pause in a LangGraph workflow with state saved in SQLite. A
      decision must be signed with the adjuster's Ed25519 key over the claim, its fields and the
      evidence hash; come from a registered adjuster within their authority; quote the hash of
      the evidence pack the claim was paused with, which must match the pack stored under that
      hash in the audit database; on a USD claim pay no more than was claimed, and give a reason for any override or
      denial. Only senior adjusters may pay a claim with a fraud flag or above-low risk, or one the
      AI never assessed for fraud (a stopped claim); denying more than an adjuster's authority, or
      paying or denying a claim whose amount can't be compared with USD limits (not in USD, or
      nothing extracted), also needs a senior adjuster.
      The adjuster is shown the stored pack, with a warning if the checkpoint no longer matches
      it. A decision signed with a public demo key is marked as such in the record. A claim gets
      one evidence pack and one final decision: the audit log refuses a second of either inside
      the same write transaction, so two runs or two adjusters at once, or a checkpoints file
      restored from a backup, can't triage, decide or pay it again. The log, not the
      checkpoint, says whether and how a claim was decided: a decision in the checkpoint that
      the log doesn't hold, or that differs from it, is reported as a problem.
    status: built
    code:
      - hall_monitor/workflow.py::build_graph
      - hall_monitor/governance/approval.py::validate_decision
      - hall_monitor/governance/signing.py::verify
      - hall_monitor/workflow.py::_check_evidence
      - registry/adjusters.yaml
    tests:
      - tests/test_workflow.py::test_claim_waits_for_an_adjuster_across_a_restart
      - tests/test_workflow.py::test_payout_above_authority_needs_a_senior_adjuster
      - tests/test_workflow.py::test_decisions_that_break_the_rules_are_rejected
      - tests/test_workflow.py::test_a_decision_counts_only_with_the_adjusters_signature
      - tests/test_workflow.py::test_an_edited_checkpoint_cant_change_the_evidence
      - tests/test_workflow.py::test_the_adjuster_is_shown_the_stored_evidence_not_an_edited_checkpoint
      - tests/test_workflow.py::test_an_edited_checkpoint_result_cant_relax_the_approval_rules
      - tests/test_workflow.py::test_run_fresh_refuses_a_claim_that_finished_triage
      - tests/test_workflow.py::test_a_claim_the_log_shows_triaged_cant_be_triaged_again_with_new_checkpoints
      - tests/test_workflow.py::test_two_runs_of_the_same_claim_at_once_pay_it_once
      - tests/test_workflow.py::test_two_adjusters_deciding_at_once_decide_once
      - tests/test_workflow.py::test_a_restored_checkpoints_file_cant_decide_a_claim_again
      - tests/test_workflow.py::test_entries_appended_to_the_log_cant_relax_the_approval_rules
      - tests/test_workflow.py::test_a_checkpoint_decision_the_log_doesnt_hold_isnt_reported_decided
      - tests/test_workflow.py::test_two_runs_of_a_claim_for_review_leave_it_decidable
      - tests/test_approval_rules.py::test_paying_a_claim_the_ai_never_assessed_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_denying_more_than_your_authority_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_a_demo_key_signature_is_marked_in_the_record
      - tests/test_approval_rules.py::test_a_claim_not_in_usd_needs_a_senior_adjuster
      - tests/test_approval_rules.py::test_paying_a_risky_claim_with_no_flags_needs_a_senior_adjuster
    evidence:
      - evals/results/hardened-critic/override.json
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 4.1]
    finos:
      risks: [RI-22]
      mitigations: [MI-24]
    gaps: >-
      A payout on a claim not in USD, or with no amount extracted, is capped only by the senior
      adjuster's authority: nothing converts currency or bounds it by the claim.
      The fictional adjusters' keys are public demo keys (decisions signed with them are marked);
      a deployment would issue keys from the firm's identity system. The evidence pack lists document names rather than the documents.
      The evidence pack and the triage result the approval rules read are checked against the
      hashes the audit log recorded at triage (the pack's entry names the result it was built
      from; a second pack appended by hand makes the claim undecidable rather than replacing
      it); other checkpoint state isn't. Two runs of one claim at once both call the agents and
      both record their agent and tool calls before the second fails, so the log shows a run
      whose result wasn't recorded. A signed decision
      carries no nonce, so if a claim were ever triaged again with an identical pack, an earlier
      signature for it would verify again; the workflow refuses a second triage of any claim
      the audit log shows finished, whatever the checkpoint file holds. A crash after the
      evidence pack is logged but before the checkpoint is saved leaves that claim for a person
      to handle; it can't be restarted. The override rate is simulated with an
      answer-key adjuster; no real adjusters yet.

  - id: HM-06
    name: Tamper-evident audit log
    what: >-
      Each claim's triage (agent calls, tool calls, critic reviews, revisions, corrections, result)
      and every adjuster decision are written, as they happen, to an append-only SQLite log in
      which each entry's hash covers the previous one. Triggers refuse edits and deletes, and
      verify reports any changed, missing or reordered entry, any stored evidence pack that no
      longer matches its hash, and (opened read-only, as the audit CLI does) any trigger someone
      removed. Entries hold no claim narrative or documents; the adjuster's written reason, critic
      issues and a rejected submission are kept as keyed hashes (HMAC-SHA256), so the hashes
      alone can't confirm a guess (but see the gaps on signatures). Every read and write takes the same lock.
    status: built
    code:
      - hall_monitor/governance/audit.py::AuditLog
      - hall_monitor/audit.py::main
    tests:
      - tests/test_audit.py::test_a_changed_entry_is_detected
      - tests/test_audit.py::test_a_consistent_rewrite_is_caught_only_by_an_anchor
      - tests/test_audit.py::test_the_log_holds_no_claim_text
      - tests/test_audit.py::test_the_log_keeps_the_adjusters_reason_as_a_hash
      - tests/test_audit.py::test_a_rejected_decision_logs_no_names_or_submitted_text
      - tests/test_intake.py::test_codes_the_log_repeats_must_be_codes
      - tests/test_audit.py::test_evidence_is_stored_by_hash_and_checked_by_verify
      - tests/test_audit.py::test_read_only_verify_reports_removed_triggers_and_malformed_entries
      - tests/test_pipeline.py::test_events_are_reported_as_they_happen
      - tests/test_pipeline.py::test_a_recording_failure_stops_the_claim
      - tests/test_audit.py::test_keyed_hashes_depend_on_the_key
      - tests/test_audit.py::test_reads_and_writes_from_many_threads_stay_consistent
      - tests/test_audit.py::test_the_cli_reports_a_dropped_table_as_tampering
      - tests/test_workflow.py::test_a_rejection_logs_the_submission_as_a_keyed_hash
    evidence: []
    nist: [MEASURE 2.8, MANAGE 4.1]
    finos:
      risks: [RI-17, RI-22]
      mitigations: [MI-04, MI-21]
    gaps: >-
      Someone with write access to the file can rewrite the whole chain consistently; only a
      chain head copied elsewhere catches that, and copying it out is manual. Without
      HALL_MONITOR_AUDIT_KEY the hash key is a file beside the log, so someone with file access
      has it too; production keeps it in a secrets manager. Entries do hold
      policy numbers, decision fields and tool-call arguments. The currency and policy number
      the model extracts are repeated in routing reasons and corrections, so both must be
      code-shaped; tool-call arguments are still logged as the model wrote them. An unforeseen
      error stops the claim with its type only, since its text can repeat those arguments. The
      final decision entry keeps the adjuster's Ed25519 signature, which covers the reason, so
      anyone with the log and the public key can confirm a guessed reason: the keyed hash
      doesn't protect a signed reason yet. The audit CLI reports a file with no readable log as
      tampered with (exit 3), not missing (exit 1), and a log another process holds locked as
      busy (exit 4).

  - id: HM-07
    name: Critic review with revision history
    what: >-
      A second agent checks intake, coverage and risk against the documents and sends errors back,
      up to twice. Every revision is kept, and one that changes a decision field sends the claim
      to a person.
    status: built
    code:
      - hall_monitor/agents/critic.py::run_critic
      - hall_monitor/pipeline.py::_triage
    tests:
      - tests/test_pipeline.py::test_critic_sends_coverage_back_and_approves_the_revision
      - tests/test_pipeline.py::test_critic_change_to_the_amount_is_recorded_and_goes_to_a_person
      - tests/test_pipeline.py::test_unresolved_disagreement_goes_to_an_adjuster
    evidence:
      - evals/results/critic-seeded/findings.md
    nist: [MEASURE 2.3, MEASURE 2.5, MANAGE 1.3]
    finos:
      risks: [RI-04, RI-06, RI-14]
      mitigations: [MI-15, MI-21]

  - id: HM-08
    name: Failures stop the claim and go to a person
    what: >-
      A refusal, API error, invalid output (including output of the wrong type, or a turn that
      ended any way but end_turn), refused hall pass, missing policy or any unexpected error stops
      the claim, records why, keeps the cost of calls already made, and routes it to an adjuster.
    status: built
    code:
      - hall_monitor/pipeline.py::triage
    tests:
      - tests/test_pipeline.py::test_refusal_stops_the_claim_and_keeps_its_cost
      - tests/test_pipeline.py::test_api_error_stops_the_claim
      - tests/test_pipeline.py::test_unexpected_error_stops_the_claim
      - tests/test_pipeline.py::test_pipeline_stops_when_the_policy_cant_be_found
      - tests/test_agent_faults.py::test_a_missing_or_failed_answer_stops_the_claim_for_a_person
      - tests/test_agent_faults.py::test_an_answer_of_the_wrong_type_stops_the_claim_for_a_person
      - tests/test_agent_faults.py::test_an_incomplete_answer_stops_the_claim_for_a_person
    evidence: []
    nist: [MANAGE 2.4, MANAGE 4.3]
    finos:
      risks: [RI-07]
      mitigations: [MI-24]

  - id: HM-09
    name: Prompt-injection defences
    what: >-
      Claim text and model output are escaped and fenced as untrusted (ampersands too, so text
      written as entities doesn't render like an escaped tag). A code detector flags text aimed
      at the AI (override instructions, fake markup, claimed approval, requests to skip review,
      internal tool names) in the narrative, attachments, file names, attachment kinds and the
      channel, and sends the claim to a person. It searches the text as written and again after
      decoding entities and compatibility forms (full-width brackets) and dropping characters
      that render as nothing, so decoding only adds matches. The channel and attachment kind
      must be one of a fixed list of values, so they carry no free text into prompts or the
      audit log.
    status: built, results pending
    code:
      - hall_monitor/agents/base.py::escape
      - hall_monitor/gateway/injection.py::detect_instructions
    tests:
      - tests/test_pipeline.py::test_claim_text_cannot_close_its_fence_or_forge_feedback
      - tests/test_privacy_security.py::test_no_real_claim_is_flagged
      - tests/test_privacy_security.py::test_flagged_claim_goes_to_a_person_even_if_otherwise_automatic
      - tests/test_privacy_security.py::test_channel_and_kind_must_be_codes
      - tests/test_privacy_security.py::test_instructions_in_the_channel_or_kind_are_flagged
      - tests/test_privacy_security.py::test_encoded_markup_is_flagged_and_renders_differently
      - tests/test_privacy_security.py::test_decoding_never_hides_a_signal
      - tests/test_privacy_security.py::test_channel_and_kind_are_known_values
    evidence:
      - "pending: uv run python -m hall_monitor.evals.adversarial"
    nist: [MEASURE 2.7, MANAGE 1.3]
    finos:
      risks: [RI-10, RI-14, RI-25, RI-28]
      mitigations: [MI-03, MI-17, MI-19]
    gaps: >-
      Pattern detection misses wording it wasn't written for; the adversarial suite measures
      that. Entities encoded twice (&amp;lt;) are decoded once only. A claim whose channel or
      attachment kind isn't a known value is refused when it is loaded, before triage, with the
      fields named but not their values, so it leaves no audit entry. The coverage step's cited clauses are free
      text the recommender receives unchecked, so a clause written with a name or condition in it
      would reach a model not approved for personal data.

  - id: HM-10
    name: Identifier redaction and data minimisation
    what: >-
      Dates of birth, emails, phone, card, passport and SSN numbers, IBANs, and tax IDs, bank
      account and routing numbers labelled as such are removed from the claim text, attachment file names and tool
      results before any model sees them. Each agent input
      and each tool declares the data classes it carries, and anything beyond the agent's manifest
      is refused before the model or tool is called, and agents aren't offered tools they'd be
      refused. The recommender gets a structured summary with no names, claim text or reasoning;
      its claim type and clause numbers can reveal a medical claim, so it is approved for health
      data. Identifiers removed from tool results are counted on each tool call.
    status: built
    code:
      - hall_monitor/gateway/redaction.py::redact_claim
      - hall_monitor/agents/recommendation.py::recommendation_input
      - hall_monitor/registry.py::Registry
      - hall_monitor/tools/server.py
    tests:
      - tests/test_privacy_security.py::test_no_identifier_reaches_any_model
      - tests/test_privacy_security.py::test_redaction_never_removes_evidence_from_a_real_claim
      - tests/test_privacy_security.py::test_recommender_sees_structured_fields_only
      - tests/test_privacy_security.py::test_an_input_beyond_the_manifests_data_classes_is_refused_before_the_model
      - tests/test_privacy_security.py::test_a_tool_beyond_the_agents_data_classes_is_refused
      - tests/test_privacy_security.py::test_identifiers_are_redacted_from_tool_results_and_file_names
      - tests/test_privacy_security.py::test_tax_ids_and_bank_details_are_redacted
      - tests/test_privacy_security.py::test_bank_and_tax_patterns_leave_ordinary_evidence_alone
      - tests/test_privacy_security.py::test_redaction_stays_fast_on_long_runs_of_space
    evidence: []
    nist: [MEASURE 2.10]
    finos:
      risks: [RI-01]
      mitigations: [MI-01, MI-06, MI-12]
    gaps: >-
      Names and medical details still reach the agents that need them to decide. Tax IDs, bank
      account and routing numbers are caught only after a label ("TIN", "tax ID", "account
      number", "acct #", "A/C no.", "routing"): an unlabelled number, or "account" with no
      "number", "no." or "#", is missed, because an unlabelled run of digits could be an amount,
      a date, an invoice or a booking number. IBANs must pass their checksum and use spaces or
      dashes, or none; lower case is caught only after "IBAN". Data classes are
      declared per input by code, not detected from content, so a wrong declaration isn't caught.
      Pattern redaction misses unusual formats.

  - id: HM-11
    name: Telemetry without claim content
    what: >-
      Langfuse traces carry IDs, versions, hashes and token counts only: trace decorators don't
      capture function inputs or outputs.
    status: built
    code:
      - hall_monitor/tracing.py::observe
    tests:
      - tests/test_controls.py::test_traces_never_capture_inputs_or_outputs
    evidence: []
    nist: [MEASURE 2.10]
    finos:
      risks: [RI-01]
      mitigations: [MI-01, MI-04]
    gaps: >-
      Only the decorators are tested. Spans from any SDK instrumentation stay metadata-only only if
      it isn't configured to capture content; nothing in the code prevents that.

  - id: HM-12
    name: Eval harness and published results
    what: >-
      Deterministic scoring against answer keys: extraction, coverage reasoning with clause
      precision, risk flags, next step, routing, hallucinated values, cost and simulated override
      rate. Every run is published with its findings, including the misses and answer-key changes.
    status: built
    code:
      - hall_monitor/evals/scoring.py::score_run
      - hall_monitor/evals/baseline.py::main
    tests:
      - tests/test_scoring.py::test_ground_truth_scores_perfectly
      - tests/test_scoring.py::test_failed_runs_count_against_every_metric
    evidence:
      - evals/results/baseline-26/findings.md
      - evals/results/hardened-critic/findings.md
    nist: [MEASURE 1.1, MEASURE 2.1, MEASURE 2.3, MEASURE 2.5]
    finos:
      risks: [RI-04, RI-06]
      mitigations: [MI-05]
    gaps: >-
      Published results were scored on earlier agent versions (named in each findings note).
      Coverage counts as correct when every deciding clause is cited, even with extra clauses;
      clause precision is reported separately.

  - id: HM-13
    name: Grounding checks and evidence for every decision
    what: >-
      Every extracted name, policy number, place and amount, and every cited clause, must trace to
      the claim or the policy wording. Each decision carries an evidence pack: the AI's findings,
      reasons, clauses, lookups and corrections.
    status: built
    code:
      - hall_monitor/evals/scoring.py::unsupported_values
      - hall_monitor/governance/approval.py::build_evidence_pack
    tests:
      - tests/test_scoring.py::test_invented_amount_and_clause_count_as_hallucinations
      - tests/test_workflow.py::test_evidence_hash_is_stable_and_tracks_content
    evidence:
      - evals/results/hardened-critic/report.md
    nist: [MEASURE 2.9]
    finos:
      risks: [RI-04, RI-17]
      mitigations: [MI-13, MI-21]
    gaps: Only extracted values and cited clauses are checked; reasoning text isn't.

  - id: HM-14
    name: Counterfactual fairness test
    what: >-
      Each claim is re-run under names associated with six groups, swapped everywhere the name
      appears, counting changes in next step, route or payout, and per-group payment rates.
    status: built, results pending
    code:
      - hall_monitor/evals/fairness.py::name_variant
    tests:
      - tests/test_privacy_security.py::test_name_swap_leaves_no_trace_of_the_original
      - tests/test_privacy_security.py::test_fairness_runner_finds_no_flips_when_the_outcome_cannot_change
    evidence:
      - "pending: uv run python -m hall_monitor.evals.fairness"
    nist: [MEASURE 2.11]
    finos:
      risks: [RI-16]
      mitigations: [MI-05]
    gaps: Names only; pronouns, ages and addresses aren't varied.

  - id: HM-15
    name: Adversarial suite
    what: >-
      Ten attacks planted in real claims, scored on whether any raised a payout, turned a denial
      into a payment, avoided a person, read another policy's records or leaked a redacted value.
    status: built, results pending
    code:
      - hall_monitor/evals/adversarial.py::score
      - data/synthetic/adversarial/cases.json
    tests:
      - tests/test_privacy_security.py::test_adversarial_runner_scores_a_correct_pipeline_as_holding
      - tests/test_privacy_security.py::test_adversarial_runner_catches_an_inflated_payout
    evidence:
      - "pending: uv run python -m hall_monitor.evals.adversarial"
    nist: [MEASURE 2.7]
    finos:
      risks: [RI-10, RI-24, RI-25]
      mitigations: [MI-05]

  - id: HM-16
    name: Cost per claim and economy model routing
    what: >-
      Cost per claim, cache-aware and by agent, on every result and in the audit log; the policy
      wording is prompt-cached. A manifest may approve a cheaper model for small claims, off by
      default until it is evaluated; critic-driven revisions always use the main model.
    status: built
    code:
      - hall_monitor/gateway/cost.py::call_cost
      - hall_monitor/pipeline.py::_economy
    tests:
      - tests/test_cost_routing.py::test_cost_prices_cached_input_separately
      - tests/test_cost_routing.py::test_critic_revision_of_economy_work_uses_the_main_model
    evidence: []
    nist: [MEASURE 3.1, MANAGE 3.1]
    finos:
      risks: []
      mitigations: [MI-09]
    gaps: No spend alerting; economy routing is unmeasured and off.

  - id: HM-17
    name: CI checks and the eval gate
    what: >-
      Every pull request runs lint, the offline tests, the approvals check, this register's
      checks, and the eval gate, which fails when a published score is below its threshold and
      flags results scored on an older agent version or prompt than the one approved, or that
      don't record their versions.
    status: built
    code:
      - .github/workflows/ci.yml
      - hall_monitor/evals/gate.py::run_gate
      - evals/gate.yaml
    tests:
      - tests/test_gate.py::test_a_score_below_threshold_fails
      - tests/test_gate.py::test_stale_results_are_flagged
      - tests/test_gate.py::test_results_without_agent_versions_count_as_stale
      - tests/test_gate.py::test_a_changed_prompt_makes_a_result_stale
    evidence: []
    nist: [MEASURE 3.1]
    finos:
      risks: [RI-05, RI-06]
      mitigations: [MI-05, MI-10]
    gaps: >-
      The gate checks published results; it doesn't run live evals itself (that costs money and
      needs an API key), so a stale result is only a warning until a fresh baseline exists.
      Until then the gate doesn't block a regression. Metrics other than unsafe routes are read
      from the summary each run wrote. The live-eval workflow runs only from main, but that guard
      is in the workflow file, which a branch can edit in its own copy: the API key must be a
      secret of the live-eval environment limited to main, a repository setting this repo can't
      check.

  - id: HM-18
    name: Synthetic data and documented limits
    what: >-
      All data is synthetic, with answer keys whose changes are dated and justified. Each
      published run states what it can't show: sample size, one author, run-to-run variation.
    status: built
    code:
      - data/synthetic/README.md
    tests:
      - tests/test_data.py::test_ground_truth_matches_claim
      - tests/test_data.py::test_cited_clauses_exist_in_wording
    evidence:
      - evals/results/hardened-critic/findings.md
    nist: [MAP 1.1, MAP 2.1, MEASURE 1.1, MEASURE 2.5]
    finos:
      risks: [RI-19]
      mitigations: [MI-06]
    gaps: Data quality is documented, not monitored; there is no drift detection.

  - id: HM-19
    name: Kill switch
    what: >-
      An agent's owner can stop it by adding an entry to registry/stops.yaml (python -m
      hall_monitor.kill_switch stop), which changes no manifest or approval and has no code owner.
      The registry reads the stop list on every check, so a running process refuses the agent on
      its next model call, including the next tool round of a call already under way, and on its
      next tool call; a stopped agent stops the claim and sends it to a person. Every agent a
      claim's result rests on is checked again just before routing, so a claim that used the
      answer of an agent stopped after it gave it also goes to a person. The stop list fails
      closed: if it is missing, unreadable or has a key twice, names an unknown agent or a person
      not in registry/owners.yaml, or approvals clear a stop it doesn't hold, every agent is
      refused. Restarting needs the stop cleared in registry/approvals.yaml (python -m
      hall_monitor.approvals --resume), a reviewed approval.
      CI fails a pull request that removes or edits a stop. Refusals carry the stop and owner IDs,
      never the reason. Stops are written under a lock and replaced in one step, so two owners
      stopping agents at once both take effect; a symlinked stop list is written through the
      link. The stop command reads only the manifest file names, the owners and the stop list
      itself, so a broken approvals file or manifest can't block it. Tests run
      agents from a copy of the registry with no stops, so a live stop doesn't fail every later
      pull request. No agent may take the ID "pipeline", which the tool gateway reserves.
    status: built
    code:
      - hall_monitor/kill_switch.py::add_stop
      - hall_monitor/kill_switch.py::check_append_only
      - hall_monitor/registry.py::Registry
      - hall_monitor/agents/base.py::run_agent
      - registry/stops.yaml
      - registry/owners.yaml
      - .github/workflows/ci.yml
    tests:
      - tests/test_kill_switch.py::test_a_stop_takes_effect_on_the_next_call
      - tests/test_kill_switch.py::test_a_stop_needs_no_approval
      - tests/test_kill_switch.py::test_a_stop_during_an_agents_tool_rounds_halts_its_next_model_request
      - tests/test_kill_switch.py::test_a_stopped_agent_stops_the_claim_and_sends_it_to_a_person
      - tests/test_kill_switch.py::test_a_stop_after_an_agent_answers_still_sends_the_claim_to_a_person
      - tests/test_kill_switch.py::test_a_cleared_stop_that_does_not_exist_refuses_every_agent
      - tests/test_kill_switch.py::test_code_the_kill_switch_relies_on_has_a_code_owner
      - tests/test_kill_switch.py::test_clearing_the_stop_in_a_reviewed_approval_restarts_it
      - tests/test_kill_switch.py::test_an_unreadable_stop_list_refuses_every_agent
      - tests/test_kill_switch.py::test_removing_or_editing_a_stop_fails_the_check
      - tests/test_kill_switch.py::test_every_agent_is_owned_by_a_named_person
      - tests/test_kill_switch.py::test_two_stops_at_once_are_both_kept
      - tests/test_kill_switch.py::test_an_agent_can_be_stopped_while_other_registry_files_are_broken
      - tests/test_kill_switch.py::test_no_agent_may_take_the_pipelines_id
      - tests/test_kill_switch.py::test_tests_run_agents_from_a_registry_with_no_stops
      - tests/test_kill_switch.py::test_the_shipped_stop_list_is_valid_whatever_it_holds
    evidence: []
    nist: [MANAGE 2.4, GOVERN 2.1]
    finos:
      risks: [RI-14, RI-18]
      mitigations: []
    gaps: >-
      The stop list is a file beside the code: a stop reaches a running process only if that
      process reads the same file, so a deployment needs it in a store the owner can write to at
      once. Any listed owner can stop any agent, not only its own owner; that is deliberate,
      because a wrong stop fails safe. The owner ID on a stop is the one the person gave; nothing
      authenticates it. A model or tool call already in flight finishes, and the workflow's
      automatic finish, just after routing, isn't checked again. Clearing a stop takes effect
      when the registry is next loaded. Append-only is checked only on pull requests. CODEOWNERS
      covers the code, the CI workflow and the approvals, so a pull request that deleted a stop
      and disabled the check would need the owner's review, but only once branch protection is
      on, and it isn't: until then a direct push to main, and always an edit on the host, could
      delete a stop and restart the agent unreviewed. Stops are not written to the audit log as
      events; a stopped agent shows there only as the stopped claim's reason. The stop lock is a
      file lock (POSIX), so it serialises owners on one machine, not on a shared network store, and
      replacing the file needs write access to its directory.

# What this repo does not address, and why. NIST MEASURE 1.1 asks for this to be documented.
not_covered:
  - ref: GOVERN 1.1
    why: Legal and regulatory requirements for claims handling aren't analysed; this is a reference implementation, not legal advice.
  - ref: GOVERN 1.5
    why: CI checks every change, but nothing schedules periodic review of the risk process or its outcomes.
  - ref: GOVERN 4.1
    why: Organisational culture and practices are outside a codebase.
  - ref: GOVERN 6.1
    why: Third-party policies, including intellectual-property risk from the model provider, aren't addressed; the model is pinned, not assessed.
  - ref: MAP 4.1
    why: Legal and intellectual-property risks of third-party components aren't mapped.
  - ref: RI-02
    why: There is no vector store or retrieval index.
  - ref: RI-08
    why: Tampering with the foundation model is the provider's control; the repo only pins the model.
  - ref: RI-09
    why: There is no training or fine-tuning, so no training data to poison.
  - ref: RI-20
    why: Reputational risk is a business judgement; publishing results, failures included, is the only part this repo touches.
  - ref: RI-23
    why: Intellectual property in model output isn't assessed.
  - ref: RI-26
    why: The MCP server is first-party and runs in-process; nothing checks a third-party server's integrity because there isn't one.
  - ref: RI-27
    why: Workflow checkpoints are trusted local state; they aren't integrity-checked like the audit log.
  - ref: RI-29
    why: Agents hold no credentials; the API key stays in the host process.
  - ref: RI-30
    why: The system loads no skills or plugins.
  - ref: MI-02
    why: There is no external knowledge base or retrieval; the policy wording is fixed reference text.
  - ref: MI-07
    why: Legal and contractual terms with the model provider are out of scope.
  - ref: MI-23
    why: Agents hold no credentials (see RI-29), so there is nothing for them to protect.
  - ref: MI-11
    why: Adjuster overrides are recorded but not fed back into prompts, answer keys or evals.
  - ref: MI-08
    why: There is no rate limiting or denial-of-service protection; nothing is exposed as a service.
  - ref: MI-14
    why: The audit log and checkpoints are unencrypted SQLite files.
  - ref: MI-22
    why: Agents run in one process; they're separated by allow-lists and claim scope, not isolation.
  - ref: MI-25
    why: The system loads no skills or plugins (see RI-30).

