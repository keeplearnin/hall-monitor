  - id: HM-17
    name: CI checks and the eval gate
    what: >-
      Every pull request runs lint, the offline tests, the approvals check, this register's
      checks, and the eval gate, which fails when a published score is below its threshold, or
      isn't a finite number (NaN, infinity, a boolean or text fail rather than pass), and flags
      results scored on an older agent version or prompt than the one approved, or that don't
      record their versions. A check marked no_agents scores code alone (the injection
      detector) and has no agent versions to record; the gate skips that staleness check for it,
      fails it if the result does record agents, and the result is kept current by a test that
      compares it with a fresh run (the detector's source hash and every row). Required checks
      include the live run of the agentic leave path
      (route and intake accuracy at least 0.95, no errors). The offline tests run with no
      Anthropic or Langfuse key and with dotenv's loader replaced, so a test can't load the
      repo's .env (review 46). Evals count a case refused before any model call (budgets not
      approved, a cap reached, the ledger unavailable) as an error, never as a safe stop, so a
      run that tested nothing can't pass the gate.
    status: built
    code:
      - .github/workflows/ci.yml
      - tests/conftest.py
      - hall_monitor/claims/evals/scoring.py::is_infrastructure_stop
      - hall_monitor/evals/gate.py::run_gate
      - evals/gate.yaml
    tests:
      - tests/test_gate.py::test_a_score_below_threshold_fails
      - tests/test_gate.py::test_stale_results_are_flagged
      - tests/test_gate.py::test_results_without_agent_versions_count_as_stale
      - tests/test_gate.py::test_a_changed_prompt_makes_a_result_stale
      - tests/test_gate.py::test_a_metric_that_isnt_a_finite_number_fails
      - tests/test_gate.py::test_a_check_that_scores_code_needs_no_agent_versions
      - tests/test_gate.py::test_a_code_only_check_that_records_agents_is_refused
      - tests/test_offline.py::test_a_module_that_loads_dotenv_gets_the_offline_guard
      - tests/test_offline.py::test_loading_dotenv_in_a_test_puts_no_key_in_the_environment
      - tests/test_scoring.py::test_infrastructure_stops_are_told_apart_from_model_behaviour
      - tests/test_complaint_triage.py::test_a_run_where_every_complaint_is_spend_refused_counts_as_errors
    evidence: []
    nist: [MEASURE 3.1]
    finos:
      risks: [RI-05, RI-06]
      mitigations: [MI-05, MI-10]
    gaps: >-
      The gate checks published results; it doesn't run live evals itself (that costs money and
      needs an API key), so a stale result is only a warning until a fresh baseline exists.
      Until then the gate doesn't block a regression: today the claims baseline and the seeded
      critic eval are flagged stale. A failing check fails CI but doesn't block a
      merge: main has no branch protection yet. Metrics other than unsafe routes are read
      from the summary each run wrote. The live-eval workflow runs only from main, but that guard
      is in the workflow file, which a branch can edit in its own copy: the API key must be a
      secret of the live-eval environment limited to main, a repository setting this repo can't
      check. The gate reads the agent digests a result file records about itself and doesn't
      check them against the commit it was scored at, so a hand-edited results file can pass;
      code-owner review of evals/ is the check, once branch protection is on. The workflows pin
      third-party actions by version tag, not commit SHA, and live-eval passes the API key to
      a step in the same job as those actions.

