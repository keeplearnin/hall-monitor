  - id: HM-26
    name: Complaint ingestion from CFPB
    what: >-
      The complaint desk reads public CFPB complaints through one MCP tool,
      cfpb_complaint_search, behind the tool gateway: only the pipeline may call it, its
      arguments are checked (a date, a digit cursor, a page size up to 100) and every call is in
      the audit log, which keeps an argument only in that shape (named, with a keyed hash,
      otherwise). Under it, CfpbClient (egress.py) makes GET requests through the egress
      guard (HM-25), spaced one a second by default, retrying timeouts, network errors, 429 and
      5xx with exponential backoff, jitter and Retry-After up to a cap; any other failure stops
      the pull, which records failed with the error's type and keeps what it stored. The tool
      keeps an allow-list of fields, so the company name never enters the system and new
      fields are dropped and named; ZIP codes are cut to three digits. Pulls take the desk's
      products, oldest first, resume after a stored cursor (CFPB pages by search_after) that
      moves only after a page is processed, and stop at the desk's capacity, saying whether they
      caught up. Records are validated strictly and kept by complaint ID: a repeat is skipped, a
      change is a new version, a failure is quarantined once with field names and error types
      only. Each page is written to disk with a manifest of hashes before it is processed; a
      snapshot replays offline, a changed one is refused, and the pinned snapshot under
      data/cfpb/snapshots/ (its manifest hash recorded in code) is what evals and demos run on.
      CFPB's metadata reaches the audit log only in the expected shape (a timestamp, booleans, a
      count) and unknown field names only as a placeholder; a page that doesn't move the cursor
      forward fails the pull. Pulls log JSON lines and one
      complaint_pull audit entry with counts, cursor, retries and status.
