  - id: HM-19
    name: Kill switch
    what: >-
      An agent's owner can stop it by adding an entry to registry/stops.yaml (python -m
      hall_monitor.kill_switch stop), which changes no manifest or approval and has no code owner.
      The registry reads the stop list on every check, so a running process refuses the agent on
      its next model call, including the next tool round of a call already under way, and on its
      next tool call; a stopped agent stops the claim and sends it to a person. Every agent a
      claim's result rests on is checked again just before routing, so a claim that used the
      answer of an agent stopped after it gave it also goes to a person; on the agentic path
      every agent already used is checked again before each next agent, inside a critic's
      revision round too. The other workflows do the same with an answer given before a stop:
      the complaint desk's agentic loop (its default) discards the answer of a triage agent
      stopped after it answered (no draft, specialist review at high urgency), and partner-claim preparation discards both agents' answers
      (agent_stopped). The stop list fails
      closed: if it is missing, unreadable or has a key twice, names an unknown agent or a person
      not in registry/owners.yaml, or approvals clear a stop it doesn't hold, every agent is
      refused. Restarting needs the stop cleared in registry/approvals.yaml (python -m
      hall_monitor.approvals --resume), a reviewed approval.
      CI fails a pull request that removes or edits a stop, or leaves a stop list that isn't
      one (the check says so). Refusals carry the stop and owner IDs,
      never the reason. Stops are written under a lock and replaced in one step, so two owners
      stopping agents at once both take effect; a symlinked stop list is written through the
      link. The stop command reads only the manifest file names, the owners and the stop list
      itself, so a broken approvals file or manifest can't block it. Tests run
      agents from a copy of the registry with no stops, so a live stop doesn't fail every later
      pull request. No agent may take the ID "pipeline", which the tool gateway reserves.
    status: built
    code:
      - hall_monitor/kill_switch.py::add_stop
      - hall_monitor/kill_switch.py::check_append_only
      - hall_monitor/registry.py::Registry
      - hall_monitor/agents/base.py::run_agent
      - registry/stops.yaml
      - registry/owners.yaml
      - .github/workflows/ci.yml
    tests:
      - tests/test_kill_switch.py::test_a_stop_takes_effect_on_the_next_call
      - tests/test_kill_switch.py::test_a_stop_needs_no_approval
      - tests/test_kill_switch.py::test_a_stop_during_an_agents_tool_rounds_halts_its_next_model_request
      - tests/test_kill_switch.py::test_a_stopped_agent_stops_the_claim_and_sends_it_to_a_person
      - tests/test_kill_switch.py::test_a_stop_after_an_agent_answers_still_sends_the_claim_to_a_person
      - tests/test_kill_switch.py::test_a_cleared_stop_that_does_not_exist_refuses_every_agent
      - tests/test_kill_switch.py::test_code_the_kill_switch_relies_on_has_a_code_owner
      - tests/test_kill_switch.py::test_clearing_the_stop_in_a_reviewed_approval_restarts_it
      - tests/test_kill_switch.py::test_an_unreadable_stop_list_refuses_every_agent
      - tests/test_kill_switch.py::test_removing_or_editing_a_stop_fails_the_check
      - tests/test_kill_switch.py::test_every_agent_is_owned_by_a_named_person
      - tests/test_kill_switch.py::test_rounds_already_sent_stay_in_the_record_when_an_agent_is_interrupted
      - tests/test_kill_switch.py::test_two_stops_at_once_are_both_kept
      - tests/test_kill_switch.py::test_an_agent_can_be_stopped_while_other_registry_files_are_broken
      - tests/test_kill_switch.py::test_no_agent_may_take_the_pipelines_id
      - tests/test_kill_switch.py::test_tests_run_agents_from_a_registry_with_no_stops
      - tests/test_kill_switch.py::test_the_shipped_stop_list_is_valid_whatever_it_holds
      - tests/test_kill_switch.py::test_a_malformed_stop_list_fails_the_check_with_a_message
      - tests/test_kill_switch.py::test_the_kill_switch_drill_finds_no_call_or_automatic_route_after_a_stop
      - tests/test_kill_switch.py::test_the_drill_fails_when_the_kill_switch_is_broken
      - tests/test_kill_switch.py::test_the_drill_judges_a_call_by_when_its_stop_check_ran
      - tests/test_kill_switch.py::test_the_drill_still_counts_a_call_whose_check_ran_after_the_stop
      - tests/test_agentic.py::test_a_stop_during_a_revision_round_halts_it_before_the_next_agent
      - tests/test_desk_agentic.py::test_a_triage_agent_stopped_after_it_answered_has_its_answer_discarded
      - tests/test_partner_agents.py::test_a_stop_made_after_the_intake_agent_answered_sends_the_claim_to_a_person
    evidence:
      - evals/results/kill-switch-drill/results.json
    nist: [MANAGE 2.4, GOVERN 2.1]
    finos:
      risks: [RI-14, RI-18]
      mitigations: []
    gaps: >-
      The stop list is a file beside the code: a stop reaches a running process only if that
      process reads the same file, so a deployment needs it in a store the owner can write to at
      once. Any listed owner can stop any agent, not only its own owner; that is deliberate,
      because a wrong stop fails safe. The owner ID on a stop is the one the person gave; nothing
      authenticates it. A model or tool call already in flight finishes, and the workflow's
      automatic finish, just after routing, isn't checked again. Clearing a stop takes effect
      when the registry is next loaded. Append-only is checked only on pull requests. CODEOWNERS
      covers the code, the CI workflow and the approvals, so a pull request that deleted a stop
      and disabled the check would need the owner's review, but only once branch protection is
      on, and it isn't: until then a direct push to main, and always an edit on the host, could
      delete a stop and restart the agent unreviewed. Stops are not written to the audit log as
      events; a stopped agent shows there only as the stopped claim's reason. The stop lock is a
      file lock (POSIX), so it serialises owners on one machine, not on a shared network store, and
      replacing the file needs write access to its directory. The offline drill
      (evals/stop_timing.py) judges each call by when the hall-pass check that let it through
      began, so a check that began just before a stop finished writing but read the file after it
      counts as before the stop: lenient within those few milliseconds.

  - id: HM-20
    name: Read-only control panel
    what: >-
      A web panel (python -m hall_monitor.panel serve) and a JSON read API over the governance
      core: an overview per workflow with what needs attention first (for claims: cases, the
      share sent to a person, overrides, stopped cases, refused decisions, cost; for leave
      requests: requests, the share sent to HR review, waiting, approved, denied, extended,
      information asked for, refused decisions, preparations stopped before the rules, text aimed
      at the AI, cost), the agent inventory, each agent's manifest, approval, stops and eval
      results, the review queue for claims and for leave requests, each case's and each leave
      request's full audit trace, audit-chain verification against an anchored head, the eval gate and this register.
      Each view asks the code that enforces the control: an agent's state is Registry.require's
      answer with its current prompt, the audit view is AuditLog.verify, the eval view is the CI
      gate's result. It can't change anything: every route is GET, the audit log is opened
      read-only, the checkpoints (which hold claim text) are never opened, and reading every
      page leaves every file byte for byte as it was. Stopping, deciding and approving stay in
      the kill switch, the review CLI and reviewed registry changes. It shows no free text the
      model wrote: a case trace shows an allow-list of fields for each audit event, so tool arguments,
      tool errors, the policy numbers in code corrections and revisions, and any field it doesn't
      know are withheld, and a routing, stop or refusal reason is shown only if it matches one of
      the code's own templates (a template added later is withheld until listed). Kill-switch stop
      reasons, evidence packs, adjusters' reasons and decision signatures are left out too. A
      shown value must look like the code wrote it (a number, a code, a list or map of them), or
      it is withheld. A log that isn't a database or whose entries don't parse is reported as
      unreadable on every page, and an entry with fields of the wrong type is shown with them
      withheld, not as an error. A case's route is the result its evidence pack records, as the
      workflow reads it.
      Pages carry a policy that allows no scripts and nothing from other origins, every value is
      escaped, and the server answers only requests addressed to localhost or 127.0.0.1 and listens
      only on IPv4 loopback. `snapshot` saves every page and its JSON as static files, each page
      carrying the same policy, and writes nothing outside its folder: a claim ID that can't be a
      file name gets no page; `demo` builds demo data by running the synthetic
      claims through the real workflow with a scripted model, and every demo page says so. The
      review queue is what the audit log records: routed to a person, with an evidence pack and no
      decision. A claim that finished triage with no decision recorded on any other route is shown
      as needing a person, not queued.
    status: built
    code:
      - hall_monitor/panel/views.py::agents
      - hall_monitor/panel/views.py::case_trace
      - hall_monitor/panel/views.py::audit_integrity
      - hall_monitor/panel/app.py::create_app
      - hall_monitor/panel/__main__.py::snapshot
      - hall_monitor/panel/demo.py::build
    tests:
      - tests/test_panel.py::test_every_route_only_reads
      - tests/test_panel.py::test_reading_every_page_leaves_every_file_as_it_was
      - tests/test_panel.py::test_the_panel_opens_the_audit_log_read_only_and_never_the_checkpoints
      - tests/test_panel.py::test_no_page_shows_claim_text_stop_reasons_adjuster_reasons_or_signatures
      - tests/test_panel.py::test_model_written_text_in_the_log_never_reaches_a_page
      - tests/test_panel.py::test_every_reason_the_code_writes_is_shown
      - tests/test_panel.py::test_every_audit_log_the_panel_opens_is_read_only
      - tests/test_panel.py::test_a_snapshot_never_writes_outside_its_folder
      - tests/test_panel.py::test_a_damaged_audit_log_shows_as_damaged_not_as_an_error
      - tests/test_panel.py::test_the_queue_holds_only_claims_routed_to_a_person
      - tests/test_panel.py::test_every_reason_the_code_generates_is_shown
      - tests/test_panel.py::test_an_entry_with_fields_of_the_wrong_type_shows_as_an_entry_not_an_error
      - tests/test_panel.py::test_a_case_s_route_is_the_one_its_evidence_pack_records
      - tests/test_panel.py::test_values_from_the_log_are_escaped
      - tests/test_panel.py::test_requests_for_another_host_are_refused
      - tests/test_panel.py::test_serve_refuses_to_listen_beyond_this_machine
      - tests/test_panel.py::test_an_agent_state_is_the_registry_s_own_answer
      - tests/test_panel.py::test_an_unreadable_stop_list_shows_every_agent_refused
      - tests/test_panel.py::test_audit_integrity_checks_an_anchored_head
      - tests/test_panel.py::test_the_eval_view_is_the_gate_s_result
      - tests/test_panel.py::test_the_eval_view_judges_results_against_the_panel_s_own_approvals
      - tests/test_panel.py::test_the_hr_overview_tells_the_demo_s_leave_story
      - tests/test_panel.py::test_no_page_shows_an_employee_s_message_the_pack_or_a_decision_s_reason
      - tests/test_panel.py::test_every_refusal_the_sign_off_can_give_is_shown_not_withheld
      - tests/test_panel.py::test_a_leave_trace_shows_no_employee_and_no_sensitive_reason
      - tests/test_panel.py::test_a_leave_page_gives_nothing_to_work_out_a_reason_from
      - tests/test_panel.py::test_an_unreadable_pack_is_reported_not_a_crash
      - tests/test_panel.py::test_a_leave_refusal_under_a_claim_id_doesn_t_turn_it_into_a_leave_request
      - tests/test_panel.py::test_every_refusal_message_the_code_writes_matches_a_panel_template
      - tests/test_panel.py::test_every_hr_stop_and_note_problem_is_shown_not_withheld
    evidence: []
    nist: [GOVERN 1.6, MANAGE 4.1]
    finos:
      risks: [RI-22]
      mitigations: [MI-04, MI-21]
    gaps: >-
      No sign-in and no roles yet: it serves this machine only, so anyone who can reach it there
      sees everything, and the four roles in the design (viewer, reviewer, owner, approver) aren't
      built. It is read-only by design for this phase; stopping an agent and signing a decision
      from the panel are the next phase and aren't built. It reads the SQLite audit log and the
      registry files on one machine, so it shows only what that machine's runs wrote; there is
      no shared store. Leave requests come from the audit log; nothing from an evidence pack (the
      employee's message and health details) is shown, though the integrity check reads and
      hashes every pack (cached until the log changes) and a request whose pack is erased,
      changed or unreadable isn't shown as waiting. A single leave request shows its state,
      route, outcome, who decided and their role, and counts of refusals and information
      requests; not its reasons, the role it needs, its check results, its weeks, or a refusal
      that names a rule (shown as refused by a leave rule), because together those let anyone
      with the panel work out a sensitive reason. The overview counts reasons across requests,
      which on a handful of requests can still narrow down who, and each request's ID and times
      are shown, so someone who knows when a colleague asked can find the request (though not
      its reasons). A request is a leave request only if the leave pipeline wrote to it, so an HR
      command under a claim's ID can't move the claim. The route shown is the one logged just
      before the evidence pack, which is the pack's unless two preparations of the same request
      interleave. It can't anchor audit
      heads itself: verifying against an anchor needs a head someone copied out. The demo's model is
      scripted from the answer key, so its routing, cost and override numbers show the controls
      working, not how well the agents perform. Routing and stop reasons the code writes name
      agent, stop and owner IDs and amounts; a reason in a form the panel doesn't list is withheld,
      which hides it from the reader too. The review queue reads the audit log, not the
      checkpoints, so the review CLI can still refuse a listed claim whose saved state is missing
      or changed. A saved snapshot is served without the HTTP headers, so its policy is the page's
      own meta tag, which can't forbid framing. It does show typed values the model chose
      (amounts, dates, claim types, risk levels and flags, a currency code), which are decision
      fields, not free text. The check that a value looks code-written is a backstop for a
      changed entry, not a filter for personal data: a name with no spaces would pass it, so the
      guarantee holds for a log that verifies, and the audit page says when it doesn't.

  - id: HM-21
    name: Leave eligibility and routing in code (HR example)
    what: >-
      The second worked example's governance core, before any agent exists: federal FMLA
      eligibility and entitlement are checked by ordinary code against synthetic employee and
      worksite records (python -m hall_monitor.hr). Employer coverage (a public agency, or 50 or
      more employees in 20 workweeks this or last calendar year), 52 weeks on the payroll (any
      week with a day of employment counts; service before a break of 7 years or more doesn't),
      1,250 hours worked in the 12 months before leave, 50 employees within 75 surface miles of
      the worksite (the employer's own sites, inclusive), a qualifying reason, and whether the
      leave fits in the weeks left, counted in workdays of the employee's normal workweek, under
      each of the four leave-year methods (26 weeks for military caregiver leave, in one period
      measured forward from its first workday; while that period is open, other leave is held to
      the 12 weeks for other reasons and to the 26 less all leave in the period, whichever is
      less). Each check passes, fails or can't be decided, with
      the facts it was decided on, and a missing fact is never filled in: a missing coverage year,
      distance, hours week, home state or employer record, an unknown leave-year method, or
      earlier caregiver leave whose servicemember the records don't name, is "can't decide", not
      a failure. Birth bonding leave starting before the birth can't be decided either: before a
      birth it is prenatal care or a health condition, not bonding. Nor can military leave (a
      qualifying exigency or military caregiver leave) for a covered relationship: the family
      member's covered active duty or covered servicemember status isn't in the records, so the
      reason check is "can't decide" (military_status_unverified). A code rule then sends every check
      that didn't pass (intermittent leave whose dates hold more workweeks than are left can't
      be decided to fit, and goes to an HR director) and every flag (intermittent leave,
      retaliation risk, a possible
      accommodation, a state with its own leave law where the employee works or lives, a key
      employee, a spouse at the same employer where leave may be shared, bonding leave running
      past its 12 months) to HR review, and names the least senior role that may decide, from
      the three roles of a branch company: the employee's local manager, an HR business
      partner and an HR director. Every reason names an HR business partner or above, so a
      local manager never decides a flagged request; extending past the entitlement, deciding
      a case with a retaliation risk, a request the agentic path routed before the rules ran
      (assessment_skipped) and one refused at the spending cap need an HR director. A request
      that stops before the rules run (no dates, no record, an invalid range, a failed call)
      still carries the retaliation risk from the employee's record, so it needs an HR director
      too (review 46). Only a clean request with no reason at all takes the light path
      (manager_sign_off), and even that is a draft for the local manager to sign, never an
      approval without a person. The
      records hold no names and no diagnosis; the health information they do hold is coarse (the
      reason category of a request and of leave already taken, whether an adult child can't care
      for themselves, signs of an accommodation need), and bonding requests carry the date of the
      birth or placement. A test fixes the list of fields of every record, nested ones included,
      so a new one is a reviewed change. 28 synthetic requests sit on the boundaries, each with
      an answer key worked out by hand.
    status: partial
    code:
      - hall_monitor/hr/eligibility.py::assess
      - hall_monitor/hr/eligibility.py::entitlement
      - hall_monitor/hr/routing.py::route_leave
      - hall_monitor/hr/__main__.py::main
      - data/synthetic/hr/ground_truth.json
    tests:
      - tests/test_hr_leave.py::test_intermittent_leave_whose_dates_hold_more_than_is_left_goes_to_an_hr_director
      - tests/test_hr_leave.py::test_every_request_gets_the_answer_key_s_result
      - tests/test_hr_leave.py::test_every_routing_reason_is_in_an_answer_key
      - tests/test_hr_leave.py::test_service_is_52_weeks_on_the_payroll
      - tests/test_hr_leave.py::test_hours_are_1250_in_the_12_months_before
      - tests/test_hr_leave.py::test_weeks_on_the_payroll_missing_from_the_ledger_aren_t_counted_as_zero
      - tests/test_hr_leave.py::test_worksite_counts_the_employer_s_sites_within_75_miles_inclusive
      - tests/test_hr_leave.py::test_weeks_used_by_leave_year_method
      - tests/test_hr_leave.py::test_the_entitlement_boundary
      - tests/test_hr_leave.py::test_earlier_caregiver_leave_in_an_ended_period_can_t_be_decided
      - tests/test_hr_leave.py::test_other_leave_in_an_open_caregiver_period_counts_towards_the_26
      - tests/test_hr_leave.py::test_a_monday_to_friday_request_is_counted_in_workweeks
      - tests/test_hr_leave.py::test_birth_bonding_before_the_birth_can_t_be_decided_but_placement_can_start_before
      - tests/test_hr_leave.py::test_any_flag_on_a_clean_request_sends_it_to_hr_review
      - tests/test_hr_leave.py::test_a_check_that_didn_t_pass_reaches_a_person_even_without_a_code
      - tests/test_hr_leave.py::test_a_local_manager_never_decides_a_flagged_request
      - tests/test_hr_leave.py::test_the_light_path_is_the_local_manager_s
      - tests/test_hr_leave.py::test_military_leave_without_a_verified_military_status_goes_to_a_person
      - tests/test_hr_leave.py::test_the_records_carry_only_the_fields_the_rules_read
    evidence:
      - evals/results/hr-agentic-live/results.json
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 1.3]
    finos:
      risks: [RI-22, RI-24]
      mitigations: []
    gaps: >-
      Status is partial: the rules are our reading of the federal regulations (29 CFR Part
      825), not reviewed by HR or an employment lawyer, and not legal advice, and state laws
      aren't modelled (the agents are HM-22 and the signed sign-off HM-23, which enforces the
      role the rule names). The live run (evals/results/hr-agentic-live) routed all 28
      synthetic requests as their answer keys then did (lr_011's changed afterwards; see
      below), but the requests and keys are one person's
      and it is one run. The director's cases come from the design for HR review, which is a
      Claude Doc outside this repo; the three roles are modelled on how a branch company
      works, and sending every flag to an HR business partner is this code's choice, not
      confirmed by HR. More leave than is left goes to an HR director although an HR business
      partner could deny the excess. Military leave is held for a person on every request with
      a covered relationship, because no record carries the covered status. The positions
      taken on the design's open questions, and on when employer coverage is judged (the notice
      date's calendar year and the one before), are assumptions listed in
      data/synthetic/hr/README.md. State and local leave laws, company policy, paid leave and
      short-term disability aren't modelled: a state list only routes a request to a person, and
      isn't a legal list. Rolling-backward entitlement is measured once, at the leave's start, not
      again as older leave falls out of the window during a long leave; a normal workweek is a fixed
      set of weekdays, so variable schedules and overtime aren't modelled; hours count whole weeks
      ending inside the 12 months; the notice deadline skips weekends, not holidays; eligibility
      is judged at the leave's start, so leave that becomes FMLA leave once the employee reaches
      12 months during it (825.110(d)) isn't split out; a fixed leave year is one date for the
      whole employer, so a year from each employee's hire date isn't supported; and an
      integrated employer or joint employment, which can change who counts towards the 50, isn't
      modelled. The records are snapshots, not histories. Intermittent leave's weeks are
      counted as taken, so the check bounds them by its dates: one whose dates hold more
      workweeks than are left goes to an HR director even if it would use fewer, so most long
      intermittent requests do (lr_011, a choice made with the repo owner). Until review 49
      intermittent leave passed whenever any weeks were left, so an employee with 2 weeks left
      who called a request intermittent reached an HR business partner instead; the live
      injection eval found it (atk-steer-output-07 on lr_009, both trials,
      evals/results/injection-live/report.md, a run made before the fix). lr_011's answer key
      changed with the fix; the live leave run (hr-agentic-live) predates it, but its lr_011
      extraction was exact and the route is code on the extraction, so the current rules give
      the new key on it; the supervisor and explainer read the route, so a new run could
      differ, and none was made.

  - id: HM-22
    name: Leave agents inside the shared controls (HR example)
    what: >-
      Two agents prepare a leave request for a person (since HM-32 a leave supervisor chooses
      which runs and when; the rules still run on the first intake), through the same call path, registry,
      approvals, kill switch, data-class check and audit log as the claims agents
      (hall_monitor/hr/pipeline.py). The leave intake agent reads the employee's message after
      identifier redaction and returns dates, a reason category and yes-or-no facts only: its
      answer has no free-text field, so a diagnosis has nowhere to go. The rules in code (HM-21)
      then decide eligibility, entitlement, the route and the role. The intake agent's answer is
      what the rules run on, so a wrong extraction changes the result; the eval measures that.
      The leave explanation agent reads only the code's result, never the message, the employee
      ID or the request ID, and writes an advisory note for the person who decides the request
      (the local manager for a plain request, HR for anything flagged; prompt v2), a list of
      one note per check, kept only if it covers exactly the checks the code made; it can't change the
      route or the role. Text in the message aimed at the AI (the injection detector, run on the
      message as sent and as redacted) sends the request to HR review whatever the agents say.
      Any failure of intake or the rules stops the request and sends it to a person, keeping the
      code's reasons if it had routed (a failure of the intake call itself leaves no evidence
      pack, so the request is listed as stopped and can be prepared again once the cause is
      fixed): a refusal, a stopped or unapproved intake agent, an API
      error, any unexpected error, an extraction without dates, with an end before its start or
      with a date outside 1900 to 2199, no employee record, or a cost that can't be shown. A failed or
      stopped explanation agent doesn't stop the request: it goes to the same person without a
      note, the log says why, and the eval counts it. Each agent's input is declared with the
      data classes it carries and checked against its hall pass before the model is called:
      personal and health data for intake, health only (the reason category) for the
      explanation, whose input also holds the employee's employment facts (hours, weeks of
      service, worksite), which no data class covers. Each step is written to the audit log as it
      happens: IDs, keyed hashes (HMAC), counts, codes and costs, never the message, the
      extraction's values or the explanation's text. The only plain hashes are of the published
      prompt templates: each agent call's hash of what the agent was sent is logged keyed, and
      kept out of traces, because the explanation's input has so few possible values that a
      plain hash could be confirmed by guessing. An eval (python -m hall_monitor.hr.evals) scores intake field by field
      and the end-to-end result against the answer keys, including the intake errors the rules
      can't see. One live run is published (evals/results/hr-agentic-live, the agentic path,
      28 synthetic requests on the approved leave intake v1, supervisor v1 and explainer v2,
      claude-haiku-5-5, commit 99399d1, clean tree): route accuracy 1.0, intake field accuracy
      1.0 with all 28 extractions exact, 28 notes kept, 0 explanation failures, 0 errors,
      0.0258 USD in all; the CI gate requires route and intake accuracy of at least 0.95 and no
      errors.
    status: partial
    code:
      - hall_monitor/hr/pipeline.py::prepare
      - hall_monitor/hr/leave_intake.py::run_leave_intake
      - hall_monitor/hr/leave_explainer.py::run_leave_explainer
      - hall_monitor/hr/evals.py::run
      - registry/leave_intake.yaml
      - registry/leave_explainer.yaml
    tests:
      - tests/test_hr_agents.py::test_each_message_reaches_the_answer_key_s_result
      - tests/test_hr_agents.py::test_the_eval_catches_an_intake_error_the_rules_can_t_see
      - tests/test_hr_agents.py::test_text_aimed_at_the_ai_sends_the_request_to_a_person
      - tests/test_hr_agents.py::test_identifiers_are_redacted_before_the_intake_agent_reads_the_message
      - tests/test_hr_agents.py::test_the_explanation_agent_never_sees_the_message_or_who_it_is_from
      - tests/test_hr_agents.py::test_the_intake_answer_has_no_field_free_text_could_go_in
      - tests/test_hr_agents.py::test_a_stopped_intake_agent_stops_the_request
      - tests/test_hr_agents.py::test_without_a_usable_explanation_the_request_goes_to_the_same_person
      - tests/test_hr_agents.py::test_each_step_is_logged_with_nothing_the_employee_or_a_model_wrote
      - tests/test_hr_agents.py::test_the_logged_hashes_can_t_be_checked_against_a_guess
      - tests/test_hr_agents.py::test_an_unexpected_error_in_an_agent_goes_to_a_person
      - tests/test_hr_agents.py::test_an_extreme_date_from_the_model_goes_to_a_person
      - tests/test_hr_agents.py::test_the_explanation_s_shape_survives_the_schema_the_api_is_sent
      - tests/test_hr_agents.py::test_hr_phrasings_and_tags_aimed_at_the_ai_are_caught
      - tests/test_hr_agents.py::test_no_plain_hash_of_what_an_agent_was_sent_is_logged
      - tests/test_hr_agents.py::test_no_plain_hash_of_an_hr_agent_s_input_reaches_a_trace
      - tests/test_hr_agents.py::test_implausible_dates_are_refused_when_the_answer_is_parsed
    evidence:
      - evals/results/hr-agentic-live/results.json
    nist: [GOVERN 1.6, MAP 3.5, MEASURE 2.10, MANAGE 2.4]
    finos:
      risks: [RI-01, RI-10, RI-24]
      mitigations: [MI-18]
    gaps: >-
      One live run, of 28 short synthetic messages written by the same person who wrote their
      answer keys: it shows the agents reading messages of that kind, not real employees'
      messages, which are longer and messier, and says nothing about run-to-run variation. An
      intake error the rules can't see (a wrong date, the wrong family member, a missed
      accommodation sign) changes the result without a flag; the eval measures it and the
      person deciding checks the message, but nothing in code catches it. There is no critic and
      no risk agent from the design; the signed sign-off is HM-23. The injection detector's phrases were written
      for claims; it now also knows the HR tags and a few HR phrasings (approval claimed from HR,
      keeping HR or a specialist out, role play as an HR director, HR business partner or local
      manager), but it is a phrase
      list, so other phrasings get through, and the detector is shared, so those phrases can
      also flag claim text ("already approved by my HR manager" in a business-travel claim),
      which sends it to a person: the safe side. The message itself still goes to the model provider with the employee's
      name and condition: redaction removes identifiers, not health details, which the reason
      category needs. The explanation is free text checked only for which checks it covers, not
      for whether each sentence is true.

  - id: HM-23
    name: Signed HR sign-off within the role the rules name (HR example)
    what: >-
      A person decides each leave request that is prepared into the audit log (python -m
      hall_monitor.hr.run, which calls the API, then python -m hall_monitor.hr.review). Each
      prepared request leaves an evidence pack in the audit database, stored once under its hash
      (the redacted message, the structured request, the code's checks and route, the
      explanation, and a random nonce so the hash can't be confirmed by guessing); preparing a
      request again is refused, and the chain check reports a pack that was changed or erased. A decision
      counts only if the staff member is in registry/hr_staff.yaml, it is signed with their
      Ed25519 key over the request, every decision field and the evidence hash, and code finds it
      within their role: at least the role the routing rule named (a local manager for the
      light path, an HR business partner or HR director for HR review; a route or role the
      rules don't know, as a log written before the roles were renamed may hold, is refused
      cleanly); approving FMLA leave only for
      an eligible employee with a qualifying reason, for more than 0 weeks and no more than are
      left (what the records leave, less the weeks the log shows approved or extended for the
      same employee on other requests, linked by a keyed hash of the employee; extensions are
      measured on the same figure: review 46), were asked or qualify (bonding weeks after the 12 months don't); approving military
      leave whose only open question is the family member's covered status only by an HR
      business partner or above, with a reason of at least 20 characters as their written
      attestation that they checked it; approving fewer weeks
      than asked (for intermittent leave, than are left) only by an HR business partner or
      above, with a reason, since it refuses the rest;
      denying only by an HR business partner or above, with a reason; extending only by an HR director,
      with a reason, for an eligible employee whose request is past the entitlement, granting more
      weeks in total than are left and no more than were asked (intermittent leave: past the
      entitlement when its dates hold more workweeks than are left, and extended no further than
      its dates hold); deciding intermittent leave whose dates hold more workweeks than are left
      after the weeks the log shows approved on the employee's other requests only by an HR
      director, which the rules can't see (review 49); approving a request the rule sent
      to HR review only with a reason. Asking for more information is open to anyone registered
      and isn't a decision: it is signed, stored and logged once, and the request keeps waiting. The audit log decides whether a request was decided: one final
      decision per request, checked inside the write. Every refusal that reaches these rules, for
      a request in the log, is logged with why, including one that lost a race or met a changed
      or erased pack, and names the staff member only if they signed it; the CLI's refusals of
      malformed input (weeks out of range, an unreadable key, a bad staff file) aren't decisions
      and aren't logged. The log keeps the staff ID and role, the
      outcome and weeks, the code's route, and keyed hashes of the reason and the signed
      decision; the signed decision, with its reason and signature, is stored before the log entry
      is written (so a logged decision always has it, and one that lost a race is removed) beside
      the evidence pack in the store that can be erased, not in the chain, so no signature in the
      chain can confirm a guessed reason. What HR is shown comes from the pack, so a run that
      lost the race to prepare a request can't change it.
    status: built
    code:
      - hall_monitor/hr/signoff.py::validate
      - hall_monitor/hr/signoff.py::approved_weeks_for
      - hall_monitor/hr/signoff.py::decide
      - hall_monitor/hr/signoff.py::record_evidence
      - hall_monitor/hr/review.py::main
      - hall_monitor/hr/run.py::run
      - registry/hr_staff.yaml
    tests:
