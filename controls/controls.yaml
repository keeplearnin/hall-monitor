      were: once a pull has caught up, a complaint published afterwards with an earlier receipt
      time is behind the cursor and missed, unless a pull restarts from a date at least 15 days
      back (--since; dedupe makes the repeats cheap). This is the normal case, not a rare one,
      and nothing schedules the restart. Resuming reads from the day before the cursor's in
      case CFPB's date filter isn't in UTC (not checked).
