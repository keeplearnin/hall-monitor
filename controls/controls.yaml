      - tests/test_complaint_triage.py::test_a_changed_version_of_a_routed_complaint_is_re_routed_without_editing_the_log
      - tests/test_complaint_triage.py::test_a_re_route_never_lowers_the_first_route
      - tests/test_complaint_triage.py::test_a_routine_status_change_does_not_send_a_standard_complaint_to_specialists
      - tests/test_complaint_triage.py::test_a_re_route_is_written_once_per_version
      - tests/test_desk_agentic.py::test_a_triage_agent_stopped_after_it_answered_has_its_answer_discarded
    evidence:
      - "pending: uv run python -m hall_monitor.complaints.run --live --limit 50"
    nist: [GOVERN 3.2, MAP 3.5, MANAGE 2.4]
    finos:
      risks: [RI-04, RI-10, RI-14]
      mitigations: [MI-21, MI-24]
    gaps: >-
      The agent has not been run live: every test uses a fake client or the scripted stand-in,
      so its summaries, categories and urgencies are unmeasured. The keyword rules read CFPB's
      fixed labels, which are the consumer's own choice on CFPB's form: a fraud complaint filed
      under another issue is caught only if the agent raises it. CFPB no longer publishes
      narratives, so the injection and redaction paths see only the company's public response
      and the labels in live data; they are tested with made-up text. The draft check is a
      pattern list, strict on purpose (it refuses any three-digit run, so a draft quoting an
      amount is dropped too), not a review of tone or accuracy; a promise in words it doesn't
      list still passes. A change that adds no code reason, raises no floor and adds no
      narrative is not re-routed, so an edited narrative or public response that only a person
      or an agent would read differently keeps its earlier route (an added injection signal is a
      code reason and is re-routed). A changed record is re-routed only when a run meets it again: the
      ingest cursor only moves forward, so a change CFPB makes later is fetched only by a
      manual pull from an earlier date (--since), and nothing schedules that.
      The two queues and urgencies are for people; nothing here measures how fast a person
      works them. The scripted stand-in's calls still record the manifest's model; the routed entry says
      scripted (the stand-in marks itself, so no caller can omit it), and the demo refuses the
      main audit log, by any path or link to it. The hand-written label table covers the
      labels in one day's snapshot and a few more; CFPB has others, and a new label is matched
      only by the patterns. A run that routes a complaint another run claimed but
      hasn't finished yet takes the route from it (the slow run's route is then refused).

  - id: HM-28
    name: Complaint desk evals, fairness and panel page
    what: >-
      python -m hall_monitor.complaints.evals runs every complaint in the pinned CFPB snapshot
      through the desk's pipeline into a throwaway audit log and scores it by code. Routing is
      scored against a hand-written answer key of CFPB labels (data/cfpb/label_reasons.yaml),
      never against the routing patterns, plus the tags: every complaint the key says needs it
      reached specialist review, at high urgency, with the key's reasons; every untimely one
      reached specialist review; the code's own urgency floor was high for every must-route
      complaint; no errors and no agent failures; every stored draft is marked never sent with
      only the fields listed in the eval (not read from the draft model). A result must be of
      the mode its gate check names (scripted or live), and a live run's egress refusals are
      counted and gated. Fairness: a counterfactual check that the same complaint from
      other states and ZIP prefixes gives the same code reasons and the same text to the agent
      (gated at zero flips; it can't flip by construction, since routing doesn't read location
      and the agent is never sent it, and it calls no model), and specialist and high-urgency rates by ZIP region and by tag
      (reported, not gated: they reflect what is complained about where). CFPB's published
      company response is reported as partial ground truth. evals/gate.yaml gates the scripted
      run in CI. The control panel's Complaint desk page (read from the audit log alone) shows
      the queue, what went to specialist review and why in the code's words, urgency, cost per
      complaint, pulls with their counts, retries and status, and the no-send control's status:
      the static check run against the checkout, egress refusals logged, and drafts not marked
      never sent; never a summary or a draft's text. Each complaint says who answered it: the scripted stand-in;
      the model (the log's label means "not the scripted stand-in"); unknown when the log
      doesn't say, never assumed to be the model; no answer when the agent failed or triage was
      interrupted; not yet when it was claimed but not routed. A banner shows whenever any
      answer is scripted, and the page names the audit log it reads by its path in the repo. A complaint claimed but never routed is listed as such. After a re-route
      (record_changed, written only when a new version adds a code reason, raises the floor or
      adds a narrative) the page shows the latest route.
      Complaints never appear as claims, and their scopes have no case page.
