    gaps: >-
      The fixed HR path gives a request whose intake failed to an HR business partner (the
      local manager never decides it); only the agentic path escalates a request the rules
      never ran on to an HR director. The desk's
      re-check uses the same model and prompt, so its two answers aren't independent in any
      strong sense; the eval's "less review" counts only the code's own reasons, since the
      agent's can't exist when no triage ran. One live run of the leave supervisor has been
      made (evals/results/hr-agentic-live: the 28 synthetic requests on the approved leave
      intake, supervisor and explainer, claude-haiku-5-5, at commit 99399d1 with a clean tree:
      route accuracy 1.0, intake exact on 28 of 28, 0 errors, 0 explanation failures, 0.0258
      USD in all). It is one run over 28 short synthetic requests written by one person with
      their own answer keys, so it shows the path working end to end on the live model, not
      how it does on real messages or across runs. No live run of the claims or desk
      supervisor has been made, so how well they choose (how often they hand off or skip work
      and send cases to a person) is unmeasured; the published claims live eval results were
      scored on the fixed path with earlier agent versions, and the gate's stale check doesn't
      flag that they predate the supervisor. The order is no longer deterministic: with a live
      model, runs of one claim can take different paths at different cost. Cost and time are
      checked before each model request, each round of a specialist's tool loop included, so
      the request already running can overshoot by its own cost and time (about two minutes
      live); the desk and HR agents have no tools, so theirs are one request each; a model call in flight when a stop
      is written finishes (HM-19 gap). The supervisor's view is built by code, but the claim
      type and amounts in it come from the intake agent, which read the claim. The budget's
      numbers are set from the fixed path's published costs, not tuned on live supervisor runs.
      The claims supervisor's whole run is one node of the claims workflow's LangGraph graph,
      so nothing is saved between its steps: a triage that crashed is restarted from the start
      (run --fresh), nothing from the first attempt is reused, and the agents are called, and
      paid for, again (a live supervisor chooses afresh, so not necessarily the same ones).
      Each attempt gets a new case budget; only the workflow's daily and monthly caps count
      every attempt, so how much one claim can spend is bounded by how often it is restarted
      (ADR 0006).

  - id: HM-33
    name: Complaint submission form outside the read-only panel
    what: >-
      A separate local web form (python -m hall_monitor.complaints.submit) adds a typed-in
      synthetic complaint to the complaint desk and runs it end to end through the desk's own
      pipeline (complaints/pipeline.py triage_complaint, agentic as complaints.run runs it):
      redaction, the check for text aimed at the AI, the desk supervisor and triage agent within
      code's bounds (HM-32), routing in code (HM-27), the draft kept and never sent (HM-25), and
      the audit log, which keeps IDs, keyed hashes, codes and costs, never the text. The result
      shows on the panel's Complaint desk page, so the panel stays read-only (HM-20). The form
      takes CFPB's structured fields: a product from the pinned snapshot's list only, an issue
      and optional sub-issue (300 characters each), CFPB's two tags and an optional narrative
      (10,000 characters); anything else, a repeated field, control or invisible format
      characters (C0 and C1 controls, bidi overrides, zero-width marks, line and paragraph
      separators, blank-looking fillers) or an over-long value is
      refused before anything is logged. CFPB's labels are a fixed list and the pipeline doesn't
      redact them, so an issue or sub-issue holding anything redaction would remove (an email
      address, phone number, SSN and the like) is refused too; the narrative is redacted by the
      pipeline. Each complaint gets a synthetic ID, syn- and 12
      hex digits, which the desk's CFPB source model refuses, so it can't collide with a CFPB ID.
      The submitter sees only its ID and state, never the queue, reasons, urgency or anything an
      agent wrote, and only for complaints that run of the form added. The mode is chosen at
      start: demo mode writes to the demo log with the scripted stand-in, labelled scripted in
      the log and on the panel, and calls no API; live mode calls the Claude API through the
      desk's egress-guarded model client, which reaches only the messages endpoint and logs any
      refusal, and stops at a spend cap (--max-complaints, 5 per run by default, at most 50).
      The panel's desk page says a form complaint left claimed, not routed has no run to route
      it.
      Every page says synthetic data only and which mode it is in, and live mode states its cost.
      The leave form's protections are reused (HM-24): loopback and localhost only, a per-run
      form token, the form's own origin, only a form post, a body limit enforced while it is
      read, and the panel's page policy with a same-origin referrer policy.
