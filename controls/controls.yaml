  - id: HM-34
    name: Approved budgets and spending caps
    what: >-
      Each workflow's case budget (steps, cost, seconds), its daily and monthly spending caps and
      its owner, and the price table every cost is computed from, live in registry/budgets.yaml,
      approved by digest in approvals.yaml like a hall pass (python -m hall_monitor.approvals).
      The claims, desk and leave pipelines, and partner-claim preparation (the partners
      workflow: 2 steps, 0.05 USD and 120 seconds a case, 1.00 USD a day, 10.00 a month,
      estimates since no live run has measured those agents), read it at the start of every
      case, before any model call: a file that isn't the approved version, or can't be read, refuses the case, and with
      it unapproved no model has a price, so every cost is unknown and goes to a person. The live
      entry points (hall_monitor.claims.run, complaints.run --live, complaints.submit --live, hr.run,
      hr.submit --live) pass a spend ledger (var/spend.sqlite): each case reserves its whole case
      budget against its workflow's daily and monthly caps inside BEGIN IMMEDIATE, shared by
      every process on the machine, and settles at what it cost when it ends (an interrupted or
      unpriced case, or a failed settle, stays reserved in full). Prices are read again whenever
      the budgets or approvals file changes. A case that would pass a cap, or finds the ledger
      unreachable, is refused with no model call and goes to a person: a claim to an adjuster, a
      complaint to specialist review (spend_refused), a leave request to an HR director
      (spend_refused) with its evidence pack stored, a partner claim to review (spend_refused)
      with nothing reimbursable. A partner claim whose case budget runs out before every agent
      answered goes to review as budget_exhausted. The reasons are fixed templates, shown on
      the panel. The ledger holds workflow names, case IDs, amounts and times only.
    status: built
    code:
      - hall_monitor/budgets.py::approved_budgets
      - hall_monitor/budgets.py::Budgets
