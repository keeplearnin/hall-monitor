      - tests/test_drills.py::test_an_unexpected_error_in_one_case_is_reported_not_fatal
      - tests/test_drills.py::test_the_checks_fail_when_the_over_claim_rule_is_removed
      - tests/test_drills.py::test_an_unexpected_error_after_a_finished_submit_is_flagged
