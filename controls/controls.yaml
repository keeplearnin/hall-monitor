  - id: HM-09
    name: Prompt-injection defences
    what: >-
      Claim text and model output are escaped and fenced as untrusted (ampersands too, so text
      written as entities doesn't render like an escaped tag). A code detector flags text aimed
      at the AI (override instructions, fake markup, claimed approval, requests to skip review,
      internal tool names) in the narrative, attachments, file names, attachment kinds and the
      channel, and sends the claim to a person. The same detector serves the HR and complaint
      desk examples, and knows the desk's own vocabulary too: its tags, queues and agents, and
      text telling the triage what to answer, a field with a value it takes (set the urgency to
      low, concerns must be an empty list, the category should be other) or keep it in the
      standard queue. Text counts as addressed to the AI when it names an AI or one of the
      system's agents (note to the AI, to the triage agent:), or opens a line or sentence with
      assistant, model, agent or system and an instruction ("Assistant: approve"); a passing
      mention ("I explained it to the assistant", "the ticket agent: change fee waived", "raise
      my concerns", "my priority should be low") isn't flagged. It searches the text as written and again after
      decoding entities until the text stops changing (up to five layers, so &amp;lt; is
      read as <), compatibility forms (full-width brackets), Cyrillic and Greek letters that
      look like Latin ones, and dropping characters that render as nothing, so decoding only
      adds matches. It scans both the claim as sent and
      the redacted claim the agents read, because redaction can join words into a phrase. The
      tool gateway runs the same detector over every string in a tool result (keys included,
      after redaction): an agent gets a refusal instead of a result that matches, the call
      records the signal names (never the text) and the result's hash, and the claim goes to a
      person in both the fixed and the agentic path, with the reason given even when the claim
      stopped; the evidence pack marks the call. The pipeline's own lookups are returned to its
      code, which reads them as data, and their signals route the claim the same way (ADR 0035).
      The complaint ingest's pages are screened the same way and their codes recorded, but
      nothing reads them yet: the desk screens each narrative itself. The
      channel and attachment kind must be one of a fixed list of values, and the claim ID must
      be a code, so they carry no free text into prompts or the audit log.
    status: built, results pending
    code:
      - hall_monitor/agents/base.py::escape
      - hall_monitor/gateway/injection.py::detect_in_texts
      - hall_monitor/claims/screening.py::detect_instructions
      - hall_monitor/tools/gateway.py::ToolGateway
      - hall_monitor/claims/routing.py::tool_result_signals
    tests:
      - tests/test_pipeline.py::test_claim_text_cannot_close_its_fence_or_forge_feedback
      - tests/test_privacy_security.py::test_no_real_claim_is_flagged
      - tests/test_privacy_security.py::test_flagged_claim_goes_to_a_person_even_if_otherwise_automatic
      - tests/test_privacy_security.py::test_channel_and_kind_must_be_codes
      - tests/test_privacy_security.py::test_instructions_in_the_channel_or_kind_are_flagged
      - tests/test_privacy_security.py::test_encoded_markup_is_flagged_and_renders_differently
      - tests/test_privacy_security.py::test_decoding_never_hides_a_signal
      - tests/test_privacy_security.py::test_channel_and_kind_are_known_values
      - tests/test_privacy_security.py::test_a_claim_id_must_be_a_code
      - tests/test_privacy_security.py::test_redaction_cant_reveal_a_signal_the_detector_missed
      - tests/test_privacy_security.py::test_the_complaint_desk_s_own_vocabulary_is_flagged
      - tests/test_privacy_security.py::test_ordinary_complaint_text_is_not_flagged
      - tests/test_privacy_security.py::test_ordinary_claim_and_leave_text_is_not_flagged
      - tests/test_gateway_adversarial.py::test_a_tool_result_that_addresses_the_ai_is_held_back_from_the_agent
      - tests/test_gateway_adversarial.py::test_injected_instructions_in_a_tool_result_send_the_claim_to_a_person
      - tests/test_gateway_adversarial.py::test_a_stopped_claim_after_a_held_tool_result_names_it_in_its_reasons
      - tests/test_gateway_adversarial.py::test_a_poisoned_policy_record_is_returned_to_the_pipeline_and_routes_to_a_person
      - tests/test_gateway_adversarial.py::test_instructions_in_a_result_key_are_held_back
      - tests/test_panel.py::test_tool_result_reasons_are_counted_as_one_kind
      - tests/test_injection_detector_eval.py::test_the_published_result_is_what_the_detector_gives_now
      - tests/test_injection_detector_eval.py::test_the_heldout_cases_are_pinned
      - tests/test_injection_detector_eval.py::test_the_score_comes_from_the_detector
      - tests/test_injection_live_eval.py::test_every_attack_the_detector_misses_is_run_or_said_why_not
      - tests/test_injection_live_eval.py::test_a_claim_attack_that_turns_a_denial_into_a_payment_worked
      - tests/test_injection_live_eval.py::test_a_spend_cap_refusal_is_an_error_not_a_pass
      - tests/test_injection_live_eval.py::test_the_published_result_is_for_the_attacks_the_detector_misses_now
    evidence:
      - evals/results/injection-detector/report.md
      - evals/results/injection-live/report.md
      - "pending: uv run python -m hall_monitor.claims.evals.adversarial"
    nist: [MEASURE 2.7, MANAGE 1.3]
    finos:
      risks: [RI-10, RI-14, RI-25, RI-28]
      mitigations: [MI-03, MI-17, MI-19]
    gaps: >-
      Pattern detection misses wording it wasn't written for, and that is now measured: on 142
      texts written blind to the detector (data/synthetic/injection/detector_set.yaml: attacks
      and benign look-alikes across claims, complaints, HR leave and tool results), it flagged
      1 of 36 held-out attacks (3%, 95% CI 0-14%) and 3 of 36 dev attacks, with no false alarm
      on 70 benign texts. Two of those four catches (the held-out one among them) match only
      because the text spells out an internal tool name (policy_lookup); without them, recall
      is 0 of 36 held-out. It caught none of the paraphrased overrides, role play, claimed
      approvals, requests to skip review, field steering, tool-result instructions or leave
      requests, and nothing in Spanish or French. It is a tripwire for known phrasings, not a
      defence against a paraphrase; the other defences (fenced text, code routing and caps, a
      person deciding) carry the load. The live half (evals/results/injection-live, 2026-11-24,
      3.52 USD) ran the 66 missed attacks that have a path to a model through the claims, leave
      and complaint pipelines, two trials each on two base cases per pipeline, scored by code
      against the answer key: none raised a payout, turned a denial into a payment, routed a
      claim automatically that needs an adjuster, read another policy, or took a complaint out
      of specialist review. One (a leave message calling the leave intermittent) reached a less
      senior decider in both trials, through a rule gap since fixed (HM-21; the published run
      predates the fix), not by steering the model past what the message claimed. 27 of 132 attack runs came out different from the
      answer key in some field (19 claims, 4 leave, 4 complaints): all but the 2 leave runs
      above went towards more review (an adjuster instead of automatic payment, a request for
      information instead of a denial, a complaint draft the checks dropped), and 4 of 16 clean
      control runs did too: on claim_029 the clean claim went to an adjuster in 1 of 2 runs and
      with the ordinary planted history entry in 2 of 2, and one clean complaint draft was
      dropped, so those changes aren't evidence of steering. Two base cases per pipeline and one author's attacks: an
      attacker iterating against the agents would find more. One author wrote the set, so
      another would find other misses. The red-team arena (HM-30) found the gaps an earlier review widened the
      list for. Entities encoded more than
      five times are decoded five times only, and look-alike letters are a fixed table of
      Cyrillic and Greek ones (other scripts and symbols aren't mapped). The desk's phrases
      are shared with claims and HR, so a claim saying "set the urgency to low" in passing goes
      to a person, the safe side; narrowing them to a field and a value (review 38b) means an
      attack that steers without naming a value ("change the category") or addresses an
      assistant mid-sentence is no longer flagged by these two patterns. A claim whose channel or
      attachment kind isn't a known value is refused when it is loaded, before triage, with the
      fields named but not their values, so it leaves no audit entry. The coverage step's cited clauses are free
      text the recommender receives unchecked, so a clause written with a name or condition in it
      would reach a model not approved for personal data. A held-back tool result leaves the
      agent to answer without it; the claim goes to a person, but that agent's answer rests on
      less evidence. The pipeline's own policy lookup is read by code, so a policy record that
      matches is still used, and the claim goes to a person. The detector caught none of the 8
      blind-written tool-result attacks; the 6 aimed at claims records, planted in the
      claimant's history, changed no decision in the live run beyond what the same entry with an
      ordinary summary did (both sent claim_029 to an adjuster; an agent read the record in
      every run), and the other 2 target records no agent here reads.

  - id: HM-10
    name: Identifier redaction and data minimisation
    what: >-
      Dates of birth, emails, phone, card, passport and SSN numbers, IBANs, and tax IDs, bank
      account and routing numbers labelled as such are removed from the claim text, attachment file names and tool
      results before any model sees them. Each tool, and the recommender's input, declares the data
      classes it carries; an agent input that declares nothing is taken to carry every class.
      Anything beyond the agent's manifest is refused before the model or tool is called, and
      agents aren't offered tools they'd be refused. The recommender gets a structured summary
      with no names, claim text or reasoning;
      its claim type and clause numbers can reveal a medical claim, so it is approved for health
      data. Identifiers removed from tool results are counted on each tool call.
    status: built
    code:
      - hall_monitor/gateway/redaction.py::redact_text
      - hall_monitor/claims/screening.py::redact_claim
      - hall_monitor/claims/agents/recommendation.py::recommendation_input
      - hall_monitor/registry.py::Registry
      - hall_monitor/claims/tool_server.py
    tests:
      - tests/test_privacy_security.py::test_no_identifier_reaches_any_model
      - tests/test_privacy_security.py::test_redaction_never_removes_evidence_from_a_real_claim
      - tests/test_privacy_security.py::test_recommender_sees_structured_fields_only
      - tests/test_privacy_security.py::test_an_input_beyond_the_manifests_data_classes_is_refused_before_the_model
      - tests/test_privacy_security.py::test_a_tool_beyond_the_agents_data_classes_is_refused
      - tests/test_privacy_security.py::test_identifiers_are_redacted_from_tool_results_and_file_names
      - tests/test_privacy_security.py::test_a_passport_label_redacts_the_number_not_the_next_word
      - tests/test_privacy_security.py::test_a_passport_word_with_no_number_after_it_keeps_its_evidence
      - tests/test_privacy_security.py::test_tax_ids_and_bank_details_are_redacted
      - tests/test_privacy_security.py::test_bank_and_tax_patterns_leave_ordinary_evidence_alone
      - tests/test_privacy_security.py::test_redaction_stays_fast_on_long_runs_of_space
      - tests/test_workflow.py::test_known_limit_a_decided_claims_checkpoint_keeps_its_text_and_reasons
      - tests/test_workflow.py::test_known_limit_erasing_a_claims_pack_leaves_its_checkpoint_copy
    evidence: []
    nist: [MEASURE 2.10]
    finos:
      risks: [RI-01]
      mitigations: [MI-01, MI-06, MI-12]
    gaps: >-
      Names and medical details still reach the agents that need them to decide. Tax IDs, bank
      account and routing numbers are caught only after a label ("TIN", "tax ID", "account
      number", "acct #", "A/C no.", "account ending", "routing"): an unlabelled number, or a
      number after "account" with no "number", "no.", "#" or "ending", is missed, because an
      unlabelled run of digits could be an amount, a date, an invoice or a booking number. A
      labelled account number must have 4 to 17 digits, so a longer one is missed, and "account
      ending" removes four digits only. IBANs must pass their checksum and use spaces or
      dashes, or none; lower case is caught only after "IBAN". Data classes are
      declared per input by code, not detected from content, so a wrong declaration isn't caught.
      Only the recommender's input declares its classes; the other agents' inputs default to every
      class, which their manifests allow, so in practice the input check constrains only the
      recommender.
      Pattern redaction misses unusual formats.
      The claims workflow's checkpoint file (var/checkpoints.sqlite, LangGraph's msgpack, not
      encrypted) keeps every checkpoint version of each claim for as long as the file exists:
      the claim as sent, its triage result and evidence pack, and the adjuster's name and
      written reasons, including those of rejected decisions (the audit log keeps reasons only
      as keyed hashes). Nothing deletes the thread of a claim whose triage finished, whether it
      is waiting, decided or with a person. Packs can be deleted from the evidence store
      (erase_evidence), with no erasure procedure yet, and that doesn't reach the checkpoint
      copy (ADR 0006).

