      synthetic. Validation catches shape, not meaning: a mislabelled issue passes.

  - id: HM-27
    name: Complaint triage, routed in code
    what: >-
      Every complaint goes to a person; nothing is resolved automatically. A code rule
      (complaints/routing.py) reads CFPB's own fields and sends to specialist review, at high
      urgency, any complaint whose product, issue or sub-issue names fraud, a scam, or a
      transaction or charge the consumer didn't authorise or make, identity theft (including an
      account, loan, debt or credit inquiry the consumer says isn't theirs), foreclosure or a mortgage the consumer is struggling to pay, or
      discrimination, and any tagged Older American or Servicemember; an untimely response,
      text aimed at the AI, an agent that failed (refused, stopped, unapproved, an API error, an
      answer that didn't validate), an agent whose confidence was low or that couldn't tell the
      category, an agent urgency below the code's floor, and a concern the agent raised that the
      code didn't, go there too. The rest go to the standard queue, still for a person. The
      complaint triage agent (Haiku, no tools, approved for PII and financial data) reads the
      structured fields and the redacted free text, fenced and escaped as untrusted, without
      the complaint ID, state or ZIP prefix, and returns a summary, category, urgency,
      confidence, concerns and a draft acknowledgement. It can add reasons and raise urgency,
      never remove or lower them; a failure never invents an answer. The draft is kept only if
      it passes a strict pattern check, read as written and again decoded (entities,
      full-width forms, look-alike letters, invisible characters): no refund, credit, waiver,
      guarantee, promise of an outcome or of contact, or deadline; no link, domain-shaped token
      or spelled-out link ("example dot com"), email address, handle, phone or vanity number,
      street or PO box address, extension or person to ask for; and no run of three or more
      digits at all, so a draft with any 3-digit run (a $100 figure, a year) is not kept; the
      complaint still goes to its queue. It is never sent (HM-25). A routed complaint whose
      stored version changes in a way a person must see (the new version adds a code reason no
      earlier route gave, such as a Servicemember tag or an untimely response, raises the
      urgency floor, or adds a narrative where the routed version had none) is re-routed when a
      run meets it again: an additive complaint_rerouted entry sends it to specialist review
      with reason record_changed, every earlier reason and the new version's code reasons, at
      the higher of the earlier urgency and the new floor, with no agent call; the first route
      is never edited or lowered. The entry is written once per version: the audit log refuses
      a second complaint_rerouted with the same content hash inside its write transaction, so
      two runs at the same moment re-route it once. Any other change (a company_response
      status moving from "In progress" to "Closed with explanation", a dropped tag, an edited
      narrative) writes nothing and the earlier route stands; the run summary counts it as
      changed_not_rerouted. On the agentic path a triage
      agent stopped after it answered has its answers discarded: no draft, specialist review
      at high urgency. The audit log, scoped cfpb-<complaint id>, records the complaint's hash,
      redaction counts and injection signals, each agent call (input hash keyed), and the route
      with its reasons, urgencies, category, a keyed hash of the summary, the draft's hash and
      the cost, and whether the answer came from the scripted stand-in; never the summary or draft
      text. A complaint is triaged once: its received entry is written once, before the model
      is called, so a second worker stops with no model call. A crash after that is routed to
      specialist review (triage_interrupted) on the spot if the log can be written, and a
      complaint a killed run claimed but never routed is routed the same way by the next run. The label patterns are checked
      against every label in the pinned snapshot by a hand-written table in the tests. When the
      answer comes from a scripted stand-in, each agent_call entry is marked scripted and the
      routed entry names the model as scripted, so no entry shows a stand-in's answer as the
      hall pass's model's.
    status: built
    code:
      - hall_monitor/complaints/routing.py::route_complaint
      - hall_monitor/complaints/routing.py::code_reasons
      - hall_monitor/complaints/triage_agent.py::run_complaint_triage
