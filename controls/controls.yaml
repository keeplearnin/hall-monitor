  - id: HM-31
    name: Failure drills
    what: >-
      python -m hall_monitor.claims.drills runs the synthetic claims (twice by default, as separate
      cases) through the real claims workflow on threads, several at a time, into its own
      registry copy, audit log and checkpoints, with the model scripted from the answer key. A
      seeded plan gives a share of the cases one fault each, taking the kinds in turn: a wrong
      answer code can check (coverage pays more than was claimed), an answer of the wrong type,
      no answer, a truncated answer, an API connection error, an API timeout, a crash after the
      evidence pack is logged but before the checkpoint is saved, and the same claim submitted
      twice at once. When two thirds of the cases have begun, the risk agent's owner stops it
      in the drill's registry copy. An optional batch cost cap is held with reservations: a
      case reserves a ceiling before it starts and settles its logged cost after, and a case
      that would pass the cap isn't started and is logged as batch_budget_reached; it never
      enters the workflow, so it has no checkpoint and isn't queued for anyone, and the report
      counts it apart from the cases with a person. Checks read the audit log and the
      workflow's status, not the runner's counts: every failed, crashed or stopped case that
      started ends with a person; no case is left in progress with no one; clean cases that
      finished before the stop were decided automatically exactly when the answer key routes
      them so; no case has two evidence packs or two final decisions, and triage runs at most
      once (twice for a duplicate submission, which pays for both); every injected failure
      shows in the log as itself (a model fault by its own stop reason, a wrong answer by the
      over-claim reason in the logged routing), and a model fault the owner's stop reached
      first is listed as masked, not exercised; no case costs more than its ceiling; the
      batch's logged cost is under the cap; no reservation is left at the end; and the log
      verifies. Tracing is switched off while a drill runs. Exit code 1 on any problem. An unforeseen error in
      one case is recorded by its type and flagged, not fatal to the drill. Cases in flight at
      the stop are counted, with how many were then decided automatically. Mutation tests also
      remove the over-claim routing rule on its own. Mutation tests show the
      checks fail when the routing rule lets every claim through, when a stopped claim is left
      with no one, and when the cap never refuses.
    status: built
    code:
      - hall_monitor/claims/drills.py::plan
      - hall_monitor/claims/drills.py::run
      - hall_monitor/claims/drills.py::check
      - hall_monitor/claims/drills.py::Budget
    tests:
