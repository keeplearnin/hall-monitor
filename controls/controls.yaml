    nist: [MEASURE 2.5, MEASURE 2.7, MANAGE 2.4]
    finos:
      risks: [RI-28]
      mitigations: [MI-21]
    gaps: >-
      The model is scripted from the answer key, so the faults are the ones written into the
      drill and the run says nothing about the agents' accuracy; a real model fails in other
      ways too. Claims workflow only: the complaint desk and the HR leave pipeline aren't
      drilled yet. Threads in one process against SQLite files, not separate processes or
      machines (the once-only checks have their own multi-process test, HM-05). Cases already
      running when the stop is written may finish, including automatically (HM-19 gap: a call in
      flight finishes); the report counts the cases in flight at the stop and how many were then
      decided automatically, and the checks don't fail on them. The
      cost cap belongs to the drill runner; the claims CLI has no batch cap. A case refused by
      the cap isn't retried, so part of the cap can go unspent, and it isn't queued for a person.
      The cap holds only if no case costs more than its ceiling; that is checked after the case,
      not enforced while it runs. Tracing is switched off by removing the Langfuse keys from the
      process environment for the drill's duration, so other threads in the same process
      wouldn't trace either. Results vary run to run with
      thread timing; the drill isn't run in CI beyond the tests, and no drill report is
      published.

  - id: HM-32
    name: The agent picks the steps, code holds the boundaries
    what: >-
      The claims workflow, the complaint desk and HR leave run agentic by default. Claims: a supervisor agent (claims_supervisor, its
      own manifest and approved prompt, no tools) chooses each next step from a closed list
      (run intake, coverage, risk, the critic or the recommendation, revise the stages the
      critic raised, finish, hand off), with a reason code. It sees a view code builds from
      typed fields only (steps run, whether each result is current, decision labels, amounts,
      flag codes, the critic's stages, its last step's outcome, the budget left), never claim
      text, tool results, agent reasoning or critic wording. Code checks every choice before it
      runs: a step whose inputs aren't ready, a repeat on unchanged inputs, a revision that
      doesn't send back exactly the stages the critic raised, or one past the revision limit is
      refused and logged, and three refusals stop the claim for a person. Code checks the
      claim's budget: 16 steps before every turn, finish included, and 0.25 USD and 300 seconds
      before every model call the loop makes, each agent of a revision included; running out
      stops the claim for a person; the supervisor's hall pass is checked when it is asked and again
      before the step it chose runs, each specialist checks its own on every call, and every
      agent already used is checked again before each next agent, within a revision round too. Finish is
      a request: auto is possible only if intake found a policy and coverage, risk, the critic
      (when on) and the recommendation all ran on the latest inputs, and route_claim, unchanged,
      finds nothing for a person; a hand-off always goes to a person. Every choice is logged as
      supervisor_step with codes, counts and amounts only, and the panel's case trace shows
      them. The fixed order is kept (agentic=False) and an offline eval runs both paths over
      every synthetic claim with scripted supervisor policies, hostile and noisy ones included,
      also with a critic that raises issues and then changes its mind; the gate requires that no policy gets a claim through that the fixed path sent to a
      person. The complaint desk runs the same way (complaint_supervisor, codes only, no tools
      or data classes): run triage, one independent re-check, finish or hand off. Every triage's
      answer counts in routing and none can remove a reason or lower urgency; disagreeing
      triages add triage_disagreed, a hand-off supervisor_handed_off, finishing before triage
      triage_skipped, and a complaint no agent read goes at high urgency however the loop
      ended. Refusals, a budget (6 steps, 0.02 USD, 120 seconds, and a cost that can't be
      priced) and the kill switch send it to specialist review as supervisor_failed; a failed
      or stopped triage agent is agent_failed, and a triage agent stopped after it answered
      has its answers discarded (no draft, high urgency); both are counted in the complaint evals and gated
      at zero. An interrupted triage goes at high urgency on either path. No reply, no send (HM-25) is unchanged. The offline eval runs all 500
      pinned complaints on both paths under scripted desk policies; the gate requires that
      none gives a complaint less review than the fixed order. HR leave runs the same way
      (leave_supervisor, codes only, no tools): intake, one re-check before the rules, the rules
      in code, the explanation, finish or hand-off. The rules always run on the first intake;
      disagreeing intakes add intake_disagreed; a hand-off adds supervisor_handed_off and keeps
      the code's role; a request routed before the rules ran gets assessment_skipped, decided
      by an HR director. Refusals, a budget (8 steps, 0.02 USD, 120 seconds) and the kill
      switch send it to HR review as supervisor_failed. The offline eval runs all 28 synthetic
      requests under scripted leave policies; the gate requires that none gets a lighter route
      or a less senior role than the fixed order.
