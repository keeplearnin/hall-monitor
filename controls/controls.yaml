    gaps: >-
      No crew agents exist yet and nothing has run live; tested with scripted clients only.
      Spending is charged after each model call, so a case can overshoot by at most one call
      per grant in its tree; a call the SDK bills and then raises on (for example a parse
      error) isn't charged. Marking a case incomplete from the handoff outcomes is the crew
      pipeline's job (slice 4). A task is taken to carry every data class its writer holds, so a
      helper meant to see less needs code-built input (the crew decides which). A helper's
      answer returns to the lead as a tool result; whether the lead treats it as data rests on
      its prompt and is measured only once the crew runs (the red-team arena can target it then). The book
      and its spending live in memory for one run. A call made after the prices went away
