      - tests/test_audit.py::test_no_plain_hash_of_a_claims_agent_s_input_reaches_a_trace
      - tests/test_panel.py::test_a_plain_input_hash_from_an_older_log_is_not_shown
      - tests/test_audit.py::test_the_log_keeps_the_adjusters_reason_as_a_hash
      - tests/test_audit.py::test_a_rejected_decision_logs_no_names_or_submitted_text
      - tests/test_intake.py::test_codes_the_log_repeats_must_be_codes
      - tests/test_audit.py::test_evidence_is_stored_by_hash_and_checked_by_verify
      - tests/test_audit.py::test_read_only_verify_reports_removed_triggers_and_malformed_entries
      - tests/test_audit.py::test_a_same_named_trigger_that_does_nothing_is_reported
      - tests/test_audit.py::test_the_shipped_triggers_pass_the_check
      - tests/test_hr_signoff.py::test_the_chain_check_reports_a_changed_or_missing_signed_leave_decision
      - tests/test_pipeline.py::test_events_are_reported_as_they_happen
      - tests/test_pipeline.py::test_a_recording_failure_stops_the_claim
      - tests/test_audit.py::test_keyed_hashes_depend_on_the_key
      - tests/test_audit.py::test_reads_and_writes_from_many_threads_stay_consistent
      - tests/test_kill_switch.py::test_rounds_already_sent_stay_in_the_record_when_an_agent_is_interrupted
      - tests/test_audit.py::test_the_cli_reports_a_dropped_table_as_tampering
      - tests/test_audit.py::test_the_cli_reports_an_unparseable_entry_as_tampering
      - tests/test_workflow.py::test_a_rejection_logs_the_submission_as_a_keyed_hash
      - tests/test_privacy_security.py::test_a_claim_id_must_be_a_code
      - tests/test_privacy_security.py::test_eval_claim_variants_have_valid_claim_ids
      - tests/test_argument_redaction.py::test_the_audit_log_keeps_a_keyed_hash_an_auditor_can_check
    evidence: []
    nist: [MEASURE 2.8, MANAGE 4.1]
    finos:
      risks: [RI-17, RI-22]
      mitigations: [MI-04, MI-21]
    gaps: >-
      Someone with write access to the file can rewrite the whole chain consistently; only a
      chain head copied elsewhere catches that, and copying it out is manual. Without
      HALL_MONITOR_AUDIT_KEY the hash key is a file beside the log, so someone with file access
      has it too; production keeps it in a secrets manager. Entries do hold
      policy numbers and decision fields; a tool-call argument is kept only in its declared
      shape, any other value named with a keyed hash (HM-03). The claim ID is on every entry,
      so it must be a code (letters, digits, _ and -, up to 64). The currency and policy number
      the model extracts are repeated in routing reasons and corrections, so both must be
      code-shaped, as tool-call arguments are (HM-03). An unforeseen
      error stops the claim with its type only, since its text can repeat those arguments. The
      final decision entry keeps the adjuster's Ed25519 signature, which covers the reason, so
      anyone with the log and the public key can confirm a guessed reason: the keyed hash
      doesn't protect a signed reason yet. The audit CLI reports a file with no readable log, or
      an entry it can't parse, as tampered with (exit 3), not missing (exit 1), and a log
      another process holds locked as busy (exit 4). A model answer that fails validation
      inside the SDK's parse call is billed but raises before its usage is read, so that
      request is missing from the agent's record and its cost. A log written before the claims
      agents' input and tool-result hashes were keyed (Review 12) still holds them plain, where
      a guess could confirm the recommendation agent's structured input or, for a policy with no
      earlier claims, the insured's name; the log can't be edited, so the panel leaves those
      fields out. The published eval results (evals/results) keep the plain input hash of
      synthetic claims. Checking the signed HR decision records needs the audit key (the log
      holds only a keyed hash of each record's hash); without it verify fails with a problem
      saying so rather than passing. A record that is no longer stored is listed, not called tampering,
      because erasure under a data-protection request is allowed; verify can't tell an erased
      record from a deleted one.

