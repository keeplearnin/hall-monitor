    gaps: >-
      No agent uses grants yet: the crew's agents, tools and pipeline come in later slices, so
      this is the mechanism, tested with test manifests only. Allotments limit what a grant may
      give its children; spending against an allotment is charged under HM-35. The book
      lives in memory for one run and isn't rebuilt from the audit log, so a crash loses it (the
      case then goes to a person, as any failure does). Grants are allow-lists checked in one
      process, not isolation (MI-22 stays not covered). The gateway enforces grants on tool
      calls; what an agent passes to another in its prompt is the crew pipeline's to control.
      A grant binds the case through its book; the gateway still limits a tool's arguments to
      the case only through scope_policy (review 19); an agent given none may not call a tool
